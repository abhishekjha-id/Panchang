<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Panchang">
  <meta name="theme-color" content="#121214">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.PNG?v=4">
  <link rel="icon" type="image/png" href="icon.PNG?v=4">

  <title>Hindu Panchang</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1C1C1F;
      --elevated: #242428;
      --border: #2D2D32;
      --text: #F2F2F7;
      --muted: #8E8E93;
      --mint: #4AE3B5;
      --mint-dim: rgba(74, 227, 181, 0.13);
      --mint-border: rgba(74, 227, 181, 0.35);
      --warn: #FF6B6B;
      --warn-dim: rgba(255, 107, 107, 0.12);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px) 16px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .app-sub { font-size: 11px; color: var(--mint); font-weight: 600; margin-top: 2px; letter-spacing: 0.3px; }
    .top-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .pill-btn {
      background: var(--card); color: var(--mint); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .pill-btn:active { background: var(--elevated); }
    .lang-btn {
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      border-radius: 20px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }

    .view { display: none; animation: fadeIn 0.15s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }

    .fest-banner {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #1A2421 0%, #1C1C1F 100%);
      border: 1px solid var(--mint-border); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
    }
    .fest-kicker { font-size: 10px; font-weight: 700; color: var(--mint); letter-spacing: 0.6px; text-transform: uppercase; }
    .fest-name { font-size: 16px; font-weight: 700; margin: 2px 0; }
    .fest-date { font-size: 12px; color: var(--muted); }
    .days-badge {
      background: var(--mint); color: #0D1613; border-radius: 12px;
      padding: 8px 12px; text-align: center; min-width: 68px; flex-shrink: 0;
    }
    .days-badge .num { font-size: 18px; font-weight: 800; line-height: 1; }
    .days-badge .lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .nav-btn {
      background: var(--elevated); color: var(--mint); border: 1px solid var(--border);
      border-radius: 10px; width: 36px; height: 34px; font-size: 18px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .month-meta { text-align: center; }
    .month-title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .month-hindu { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .dow { font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .dow.sun { color: var(--mint); }
    .day {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 2px 5px 2px; cursor: pointer; min-height: 48px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    }
    .day.special { background: var(--mint-dim); border-color: var(--mint-border); }
    .day.today { border: 1.5px solid var(--mint); }
    .day.selected { background: var(--mint); color: #101815; border-color: var(--mint); }
    .day .num { font-size: 14px; font-weight: 600; line-height: 1.1; }
    .day .t { font-size: 9px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .day .dots { display: flex; gap: 3px; align-items: center; margin-top: 2px; }
    .dot-p { width: 4px; height: 4px; border-radius: 50%; }
    .dot-shukla { background: var(--text); opacity: 0.75; }
    .dot-krishna { border: 1px solid var(--muted); }
    .day.selected .dot-shukla { background: #101815; }
    .day.selected .dot-krishna { border-color: #101815; }
    .dot-fest { width: 4px; height: 4px; border-radius: 50%; background: var(--mint); }
    .day.selected .dot-fest { background: #101815; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
    .card-head h3 { margin: 0; font-size: 15px; color: var(--mint); }
    .fest-tag {
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; white-space: nowrap;
    }
    .warn-tag {
      background: var(--warn-dim); color: var(--warn); border: 1px solid rgba(255,107,107,0.35);
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    }
    .row {
      font-size: 13px; display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .lbl { color: var(--muted); }
    .val { font-weight: 500; text-align: right; }
    .val.mint { color: var(--mint); font-weight: 600; }
    .val.warn { color: var(--warn); font-weight: 600; }

    .why-box {
      margin-top: 12px; padding: 10px 12px; border-radius: 12px;
      background: var(--bg); border-left: 3px solid var(--mint);
    }
    .why-title { font-size: 10px; font-weight: 700; color: var(--mint); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
    .why-text { font-size: 12px; line-height: 1.5; color: #D8D8DF; }

    .hero { display: flex; align-items: center; gap: 14px; }
    .moon-box {
      width: 56px; height: 56px; border-radius: 14px; background: var(--bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-tithi { font-size: 20px; font-weight: 700; }
    .hero-sub { font-size: 12px; color: var(--mint); font-weight: 600; margin-top: 2px; }
    .hero-year { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .mini-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .mini-lbl { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .mini-val { font-size: 14px; font-weight: 600; margin-top: 4px; }
    .mini-val.mint { color: var(--mint); }

    .sec-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 4px 0 8px 2px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      background: var(--elevated); border: 1px solid var(--border); color: var(--text);
      font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 16px; cursor: pointer;
    }
    .chip.active { background: var(--mint-dim); border-color: var(--mint); color: var(--mint); }
    .select-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-bottom: 12px; }
    select, input[type="date"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; width: 100%; outline: none;
      color-scheme: dark;
    }
    .finder-result {
      background: var(--bg); border: 1px solid var(--mint-border); border-radius: 12px;
      padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .li-name { font-size: 14px; font-weight: 600; }
    .li-sub { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .li-badge {
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      border-radius: 10px; padding: 5px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; text-align: right;
    }
    .note { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 8px; }

    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(24, 24, 27, 0.94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 8px 4px calc(env(safe-area-inset-bottom) + 8px) 4px; z-index: 100;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--muted); font-size: 9.5px; font-weight: 600; cursor: pointer;
    }
    .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .tab.active { color: var(--mint); }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <div class="app-title" id="topTitle">Hindu Calendar</div>
      <div class="app-sub" id="topSub"></div>
    </div>
    <div class="top-actions">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">हिं</button>
      <button class="pill-btn" id="todayBtn" onclick="goToday()">Today</button>
    </div>
  </div>

  <!-- TAB 1: CALENDAR -->
  <div id="view-calendar" class="view active">
    <div class="fest-banner" id="nextFestBanner" onclick="switchTab('countdown')"></div>
    <div class="card">
      <div class="cal-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-meta">
          <div class="month-title" id="monthTitle"></div>
          <div class="month-hindu" id="monthHindu"></div>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="grid" id="calGrid"></div>
    </div>
    <div class="card" id="detailCard"></div>
  </div>

  <!-- TAB 2: PANCHANG -->
  <div id="view-panchang" class="view">
    <div class="card" id="panchangHero"></div>
    <div class="mini-grid" id="panchangGrid"></div>
    <div class="card" id="panchangTimings"></div>
    <div class="card" id="panchangKaal"></div>
  </div>

  <!-- TAB 3: MAITHIL MUHURAT -->
  <div id="view-muhurat" class="view">
    <div class="sec-title" id="secMuhurat">Maithil Brahmin Muhurat Finder (Next 90 Days)</div>
    <div class="card">
      <div class="chips" id="muhuratChips"></div>
      <div id="muhuratList"></div>
      <div class="note" id="muhuratNote"></div>
    </div>
  </div>

  <!-- TAB 4: ASTRONOMY & EVENTS -->
  <div id="view-astro" class="view">
    <div class="sec-title" id="secPlanets">Planet Positions (Sidereal / Lahiri)</div>
    <div class="card">
      <input type="date" id="astroDate" onchange="renderPlanets()" style="margin-bottom:10px;">
      <div id="planetList"></div>
    </div>

    <div class="sec-title" id="secTransits">Upcoming Transits (Gochar)</div>
    <div class="card" id="transitList"></div>

    <div class="sec-title" id="secEclipses">Eclipses (Grahan) & Sutak Timings</div>
    <div class="card" id="eclipseList"></div>
  </div>

  <!-- TAB 5: COUNTDOWNS -->
  <div id="view-countdown" class="view">
    <div class="sec-title" id="secTithiFinder">Days Until Any Tithi</div>
    <div class="card">
      <div class="chips" id="quickChips"></div>
      <div class="select-row">
        <select id="selPaksha" onchange="updateTithiFinder()"></select>
        <select id="selTithi" onchange="updateTithiFinder()"></select>
      </div>
      <div class="finder-result" id="finderResult"></div>
    </div>
    <div class="sec-title" id="secFestList">Upcoming Hindu Festivals</div>
    <div class="card" id="festList"></div>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="tabbar">
    <div class="tab active" id="tab-calendar" onclick="switchTab('calendar')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="lbl-tab-calendar">Calendar</span>
    </div>
    <div class="tab" id="tab-panchang" onclick="switchTab('panchang')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
      <span id="lbl-tab-panchang">Panchang</span>
    </div>
    <div class="tab" id="tab-muhurat" onclick="switchTab('muhurat')">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9.5 16.5 14 18 21 12 17.5 6 21 7.5 14 2 9.5 9 9 12 2"/></svg>
      <span id="lbl-tab-muhurat">Muhurat</span>
    </div>
    <div class="tab" id="tab-astro" onclick="switchTab('astro')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(-25 12 12)"/></svg>
      <span id="lbl-tab-astro">Astro</span>
    </div>
    <div class="tab" id="tab-countdown" onclick="switchTab('countdown')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
      <span id="lbl-tab-countdown">Events</span>
    </div>
  </div>

    // --- Astronomical Core ---
    const LAT = 12.9716, LON = 77.5946;
    function toRad(d) { return d * Math.PI / 180; }
    function toDeg(r) { return r * 180 / Math.PI; }
    function norm(d) { return ((d % 360) + 360) % 360; }
    function getJD(date) { return (date.getTime() / 86400000) + 2440587.5; }
    function jdToDate(jd) { return new Date((jd - 2440587.5) * 86400000); }
    function getAyanamsa(jd) { return 23.85 + 0.01396 * ((jd - 2451545.0) / 365.25); }

    function getSunLon(jd) {
      const n = jd - 2451545.0;
      const L = norm(280.460 + 0.9856474 * n);
      const g = norm(357.528 + 0.9856003 * n);
      return norm(L + 1.915 * Math.sin(toRad(g)) + 0.020 * Math.sin(toRad(2 * g)));
    }

    function getMoonLon(jd) {
      const d = jd - 2451543.5;
      const N = norm(125.1228 - 0.0529538083 * d);
      const w = norm(318.0634 + 0.1643573223 * d);
      const M = norm(115.3654 + 13.0649929509 * d);
      const L = norm(N + w + M);
      const Ms = norm(356.0470 + 0.9856002585 * d);
      const Ls = norm(282.9404 + 4.70935e-5 * d + Ms);
      const D = norm(L - Ls);
      const F = norm(L - N);
      return norm(
        L + 6.289 * Math.sin(toRad(M)) - 1.274 * Math.sin(toRad(M - 2 * D))
          + 0.658 * Math.sin(toRad(2 * D)) + 0.214 * Math.sin(toRad(2 * M))
          - 0.186 * Math.sin(toRad(Ms)) - 0.114 * Math.sin(toRad(2 * F))
      );
    }

    const PLANET_ELEMS = {
      Mercury: { a:0.38710, e:0.20563, i:7.005, O:48.331, w:29.124, M0:174.796, n:4.09233445 },
      Venus:   { a:0.72333, e:0.00677, i:3.395, O:76.680, w:54.884, M0:50.115,  n:1.60213034 },
      Mars:    { a:1.52368, e:0.09340, i:1.850, O:49.558, w:286.502,M0:19.373,  n:0.52403900 },
      Jupiter: { a:5.20260, e:0.04849, i:1.303, O:100.464,w:273.867,M0:20.020,  n:0.08309121 },
      Saturn:  { a:9.55491, e:0.05551, i:2.489, O:113.665,w:339.392,M0:317.020, n:0.03345965 }
    };

    function helioXY(el, d) {
      const M = toRad(norm(el.M0 + el.n * d));
      let E = M + el.e * Math.sin(M);
      for (let k = 0; k < 4; k++) E = E - (E - el.e * Math.sin(E) - M) / (1 - el.e * Math.cos(E));
      const xv = el.a * (Math.cos(E) - el.e), yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
      const v = Math.atan2(yv, xv), r = Math.hypot(xv, yv);
      const O = toRad(el.O), w = toRad(el.w), i = toRad(el.i);
      return {
        x: r * (Math.cos(O)*Math.cos(v+w) - Math.sin(O)*Math.sin(v+w)*Math.cos(i)),
        y: r * (Math.sin(O)*Math.cos(v+w) + Math.cos(O)*Math.sin(v+w)*Math.cos(i))
      };
    }

    function getPlanetLon(name, jd) {
      if (name === "Sun") return getSunLon(jd);
      if (name === "Moon") return getMoonLon(jd);
      const d = jd - 2451545.0;
      if (name === "Rahu") return norm(125.0445 - 0.05295377 * d);
      if (name === "Ketu") return norm(125.0445 - 0.05295377 * d + 180);
      const sunLon = toRad(getSunLon(jd));
      const ex = -Math.cos(sunLon), ey = -Math.sin(sunLon);
      const p = helioXY(PLANET_ELEMS[name], d);
      return norm(toDeg(Math.atan2(p.y - ey, p.x - ex)));
    }

    function getAllPlanets(date) {
      const jd = getJD(new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0));
      const ayan = getAyanamsa(jd);
      return ["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn","Rahu","Ketu"].map(name => {
        const lon = getPlanetLon(name, jd), lonNext = getPlanetLon(name, jd + 1);
        let delta = lonNext - lon;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        const sid = norm(lon - ayan), rashiIdx = Math.floor(sid / 30);
        return { name, rashiIdx, deg: (sid % 30).toFixed(1), retro: (name !== "Sun" && name !== "Moon" && delta < 0) };
      });
    }

    function findTithiTime(jdRef, targetDeg) {
      let jd = jdRef;
      for (let i = 0; i < 10; i++) {
        const diff = norm(getMoonLon(jd) - getSunLon(jd));
        const err = ((targetDeg - diff + 540) % 360) - 180;
        jd += err / 12.19075;
      }
      return jdToDate(jd);
    }

    function getSunTimes(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const doy = Math.floor((date - start) / 86400000);
      const B = toRad((360 / 365) * (doy - 81));
      const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
      const decl = toRad(23.45 * Math.sin(B));
      const cosH = (Math.cos(toRad(90.833)) - Math.sin(toRad(LAT)) * Math.sin(decl)) / (Math.cos(toRad(LAT)) * Math.cos(decl));
      const H = toDeg(Math.acos(Math.max(-1, Math.min(1, cosH)))) * 4;
      const solarNoonMin = 720 - 4 * LON - eot + 330;
      const mk = (mins) => { const dt = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0); dt.setMinutes(Math.round(mins)); return dt; };
      const sr = mk(solarNoonMin - H), ss = mk(solarNoonMin + H);
      const seg = (ss - sr) / 8, dow = date.getDay();
      const rahuSeg = [7,1,6,4,5,3,2][dow], yamaSeg = [4,3,2,1,0,6,5][dow];
      return {
        sunrise: sr, sunset: ss,
        rahuStart: new Date(sr.getTime() + rahuSeg * seg), rahuEnd: new Date(sr.getTime() + (rahuSeg + 1) * seg),
        yamaStart: new Date(sr.getTime() + yamaSeg * seg), yamaEnd: new Date(sr.getTime() + (yamaSeg + 1) * seg),
        abhijitStart: mk(solarNoonMin - 24), abhijitEnd: mk(solarNoonMin + 24)
      };
    }

    function getKaranaKey(diff) {
      const k = Math.floor(diff / 6);
      if (k === 0) return "Kimstughna";
      if (k === 57) return "Shakuni";
      if (k === 58) return "Chatushpada";
      if (k === 59) return "Naga";
      return KARANAS_MOV[(k - 1) % 7];
    }

    function getPanchang(date, includeExtras = false) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 6, 0, 0);
      const jd = getJD(d);
      const sun = getSunLon(jd), moon = getMoonLon(jd), ayanamsa = getAyanamsa(jd);
      const sunSid = norm(sun - ayanamsa), moonSid = norm(moon - ayanamsa), diff = norm(moon - sun);

      const tithiIdx = Math.floor(diff / 12);
      const pakshaKey = tithiIdx < 15 ? "shukla" : "krishna";
      const nakIdx = Math.floor(moonSid / (360 / 27));
      const yogaIdx = Math.floor(norm(sunSid + moonSid) / (360 / 27));
      const sunRashiIdx = Math.floor(sunSid / 30);

      const daysSinceNewMoon = diff / 12.19075;
      const nmSunSidereal = norm(getSunLon(jd - daysSinceNewMoon) - ayanamsa);
      const masaIdx = (Math.floor(nmSunSidereal / 30) + 1) % 12;

      const gy = d.getFullYear();
      const vikramSamvat = (d.getMonth() < 4 && masaIdx >= 9) ? gy + 56 : gy + 57;
      const shakaSamvat = vikramSamvat - 135;

      let festKey = LUNAR_FESTIVALS[`${masaIdx}-${tithiIdx}`] ? `${masaIdx}-${tithiIdx}` : null;
      if (d.getMonth() === 0 && d.getDate() === 14) festKey = "makar";

      const illum = Math.round(((1 - Math.cos(toRad(diff))) / 2) * 100);
      const res = {
        jd, dow: d.getDay(), tithiIdx, pakshaKey, nakIdx, yogaIdx, karanaKey: getKaranaKey(diff),
        masaIdx, masaNum: masaIdx + 1, sunRashiIdx, vikramSamvat, shakaSamvat, illum, festKey,
        isSpecial: Boolean(festKey) || [10, 14, 25, 29].includes(tithiIdx)
      };
      if (includeExtras) {
        res.tithiStart = findTithiTime(jd, tithiIdx * 12);
        res.tithiEnd = findTithiTime(jd, ((tithiIdx + 1) * 12) % 360);
        res.sunTimes = getSunTimes(d);
      }
      return res;
    }

      return `${h}:${m} ${ap}`;

      griha:    { naks: [3,4,11,13,16,20,22,25,26],     badDow: [0,2], strict: true },
      vehicle:  { naks: [0,6,7,12,13,14,21,22,23,26],   badDow: [2,6], strict: false },
      namkaran: { naks: [0,3,4,6,7,11,12,13,14,16,21,22,23,25,26], badDow: [2,6], strict: false },
      business: { naks: [0,3,4,6,7,11,12,13,14,16,20,21,22,26],    badDow: [2],   strict: false }
    };

    function isCombust(jd) {
      const sun = getSunLon(jd), ven = getPlanetLon("Venus", jd), jup = getPlanetLon("Jupiter", jd);
      return Math.min(norm(ven - sun), norm(sun - ven)) < 9 || Math.min(norm(jup - sun), norm(sun - jup)) < 11;
    }

      document.getElementById("muhuratChips").innerHTML = Object.keys(cats).map(k =>

    function renderMuhurat(type = currentMuhurat) {
      currentMuhurat = type;
      renderMuhuratChips();
      const rule = MUHURAT_RULES[type], L = I18N[lang];
      const base = new Date(); base.setHours(0,0,0,0);
      const results = [];

      for (let i = 0; i <= 90 && results.length < 10; i++) {
        const dt = new Date(base.getTime() + i * 86400000);
        const p = getPanchang(dt, false);
        const t15 = p.tithiIdx % 15;
        if ([3, 8, 13].includes(t15) || p.tithiIdx === 29) continue;
        if (rule.badDow.includes(p.dow) || !rule.naks.includes(p.nakIdx)) continue;
        if (p.masaIdx === 5 && p.pakshaKey === "krishna") continue;
        if (rule.strict) {
          if (p.sunRashiIdx === 8 || p.sunRashiIdx === 11) continue;
          const isChaturmas = (p.masaIdx === 3 && p.tithiIdx >= 10) || p.masaIdx === 4 || p.masaIdx === 5 || p.masaIdx === 6 || (p.masaIdx === 7 && p.tithiIdx < 10);
          if (isChaturmas || isCombust(p.jd)) continue;
        }
        results.push({ dt, days: i, p, st: getSunTimes(dt) });
      }

      document.getElementById("muhuratList").innerHTML = results.length ? results.map(r => `
        <div class="list-item" onclick="jumpToDate(${r.dt.getFullYear()},${r.dt.getMonth()},${r.dt.getDate()})" style="cursor:pointer;">

          </div>

        </div>

    function getUpcomingFestivals(limit = 16) {
      const list = [], seen = new Set(), base = new Date(); base.setHours(0,0,0,0);
      for (let i = 0; i <= 365 && list.length < limit; i++) {
        const dt = new Date(base.getTime() + i * 86400000), p = getPanchang(dt, false);
        if (p.festKey && !seen.has(p.festKey)) { seen.add(p.festKey); list.push({ festKey: p.festKey, date: dt, days: i, p }); }
      }
      return list;
    }

    function findNextTithi(pakshaFilter, tithi15Idx) {
      const base = new Date(); base.setHours(0,0,0,0);
      for (let i = 0; i <= 60; i++) {
        const dt = new Date(base.getTime() + i * 86400000), p = getPanchang(dt, false);
        if ((p.tithiIdx % 15) === tithi15Idx && (pakshaFilter === "Any" || p.pakshaKey === pakshaFilter)) {
          return { date: dt, days: i, p: getPanchang(dt, true) };
        }
      }
      return null;
    }

        <div class="row"><span class="lbl">${L.abhijit}</span><span class="val mint">${fmtTime(st.abhijitStart)} – ${fmtTime(st.abhijitEnd)}</span></div>
        <div class="row"><span class="lbl">${L.rahuKaal}</span><span class="val warn">${fmtTime(st.rahuStart)} – ${fmtTime(st.rahuEnd)}</span></div>
        <div class="row"><span class="lbl">${L.yamaganda}</span><span class="val">${fmtTime(st.yamaStart)} – ${fmtTime(st.yamaEnd)}</span></div>`;
    }

    const QUICK_PRESETS = [["Any",10],["shukla",14],["krishna",14],["krishna",3],["Any",12]];
    function renderCountdowns() {
      const L = I18N[lang];
      document.getElementById("quickChips").innerHTML = L.quickChips.map((lbl, idx) =>
        `<div class="chip ${idx===activeQuickIdx?'active':''}" onclick="quickTithi(${idx})">${lbl}</div>`
      ).join("");
      document.getElementById("selPaksha").innerHTML = `
        <option value="Any" ${finderPaksha==="Any"?"selected":""}>${L.anyPaksha}</option>
        <option value="shukla" ${finderPaksha==="shukla"?"selected":""}>${L.shuklaFull}</option>
        <option value="krishna" ${finderPaksha==="krishna"?"selected":""}>${L.krishnaFull}</option>`;
      document.getElementById("selTithi").innerHTML = TITHI_NAMES_15[lang].map((t,i) =>
        `<option value="${i}" ${i===finderTithi?'selected':''}>${t}</option>`
      ).join("");
      updateTithiFinder();

      document.getElementById("festList").innerHTML = upcomingFests.map(f => `
        <div class="list-item" onclick="jumpToDate(${f.date.getFullYear()},${f.date.getMonth()},${f.date.getDate()})" style="cursor:pointer;">
          <div>
            <div class="li-name">${LUNAR_FESTIVALS[f.festKey][lang]}</div>
            <div class="li-sub">${fmtShortDate(f.date)} • ${MASAS[lang][f.p.masaIdx]} ${L[f.p.pakshaKey]} ${TITHIS[lang][f.p.tithiIdx]}</div>
          </div>
          <div class="li-badge">${fmtDays(f.days)}</div>
        </div>`).join("");
    }

    function quickTithi(idx) {
      activeQuickIdx = idx;
      finderPaksha = QUICK_PRESETS[idx][0];
      finderTithi = QUICK_PRESETS[idx][1];
      renderCountdowns();
    }

    function updateTithiFinder() {
      finderPaksha = document.getElementById("selPaksha").value;
      finderTithi = parseInt(document.getElementById("selTithi").value, 10);
      const res = findNextTithi(finderPaksha, finderTithi), L = I18N[lang];
      if (!res) return;
      document.getElementById("finderResult").innerHTML = `
        <div>
          <div class="fest-name" style="font-size:15px;">${L[res.p.pakshaKey]} ${TITHIS[lang][res.p.tithiIdx]}</div>
          <div class="fest-date">${fmtShortDate(res.date)} • ${MASAS[lang][res.p.masaIdx]}</div>
          <div class="fest-date" style="color:var(--mint);margin-top:3px;">${fmtDT(res.p.tithiStart)} → ${fmtDT(res.p.tithiEnd)}</div>
        </div>
        <div class="days-badge">
          <div class="num">${res.days === 0 ? "★" : res.days}</div>
          <div class="lbl">${res.days === 0 ? L.today : (res.days === 1 ? L.day : L.days)}</div>
        </div>`;
    }

    function selectDay(y, m, d) { selectedDate = new Date(y, m, d); renderCalendar(); }
    function changeMonth(delta) { viewDate.setMonth(viewDate.getMonth() + delta); renderCalendar(); }
    function goToday() { viewDate = new Date(); selectedDate = new Date(); renderCalendar(); switchTab("calendar"); }
    function jumpToDate(y, m, d) { viewDate = new Date(y, m, 1); selectedDate = new Date(y, m, d); renderCalendar(); switchTab("calendar"); }

    function renderAll() {
      applyStaticLabels();
      renderHeader();
      renderBanner();
      renderCalendar();
      renderPanchangTab();
      renderMuhurat(currentMuhurat);
      renderPlanets();
      renderTransits();
      renderEclipses();
      renderCountdowns();
    }

    // Boot
    document.getElementById("astroDate").value = new Date().toISOString().slice(0, 10);
    renderAll();
  </script>
</body>
</html>
