<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mithila Cal">
  <meta name="theme-color" content="#0A0B0E" id="metaTheme">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.PNG?v=9">
  <link rel="icon" type="image/png" href="icon.PNG?v=9">
  <title>Mithila Calendar</title>
  <script src="astronomy.browser.min.js"></script>
  <style>
    :root {
      --bg: #0A0B0E;
      --bg-grad:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.13) 0%, transparent 42%),
        radial-gradient(circle at 86% 24%, rgba(74, 227, 181, 0.12) 0%, transparent 46%),
        radial-gradient(circle at 50% 88%, rgba(166, 120, 255, 0.11) 0%, transparent 50%),
        linear-gradient(180deg, #111318 0%, #090A0D 100%);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 55%, rgba(255, 255, 255, 0.08) 100%);
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.17) 0%, rgba(255, 255, 255, 0.06) 100%);
      --glass-inner: rgba(255, 255, 255, 0.055);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-border-soft: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(255, 255, 255, 0.08);
      --glass-sheen: linear-gradient(90deg, transparent 8%, rgba(255, 255, 255, 0.45) 50%, transparent 92%);

      --card: rgba(28, 30, 36, 0.55);
      --elevated: rgba(255, 255, 255, 0.09);
      --border: rgba(255, 255, 255, 0.14);
      --text: #F5F7FA;
      --body-text: #DDE2EA;
      --muted: rgba(235, 240, 248, 0.62);
      --mint: #5BE8BE;
      --on-mint: #081511;
      --mint-dim: rgba(91, 232, 190, 0.16);
      --mint-border: rgba(91, 232, 190, 0.42);
      --gold: #F5C451;
      --gold-dim: rgba(245, 196, 81, 0.15);
      --gold-border: rgba(245, 196, 81, 0.42);
      --fest: #FF6B6B;
      --fest-dim: rgba(255, 107, 107, 0.16);
      --fest-border: rgba(255, 107, 107, 0.42);
      --eka: #B49CFF;
      --eka-dim: rgba(180, 156, 255, 0.16);
      --eka-border: rgba(180, 156, 255, 0.42);
      --shukla: #CFD6E0;
      --krishna: #A678FF;
      --warn: #FF6363;
      --warn-dim: rgba(255, 99, 99, 0.15);
      --wk: rgba(255, 255, 255, 0.07);
      --tab-bg: rgba(22, 24, 30, 0.72);
    }

    body.light {
      --bg: #E8ECF2;
      --bg-grad:
        radial-gradient(circle at 14% 8%, rgba(255, 255, 255, 0.95) 0%, transparent 45%),
        radial-gradient(circle at 88% 20%, rgba(11, 143, 108, 0.14) 0%, transparent 48%),
        radial-gradient(circle at 50% 90%, rgba(124, 77, 255, 0.10) 0%, transparent 50%),
        linear-gradient(180deg, #EDF1F7 0%, #DFE5EE 100%);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.52) 60%, rgba(255, 255, 255, 0.68) 100%);
      --glass-strong: linear-gradient(145deg, rgba(255, 255, 255, 0.90) 0%, rgba(255, 255, 255, 0.65) 100%);
      --glass-inner: rgba(255, 255, 255, 0.52);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-border-soft: rgba(22, 24, 29, 0.10);
      --glass-shadow: 0 10px 28px rgba(18, 28, 45, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(22, 24, 29, 0.06);
      --glass-sheen: linear-gradient(90deg, transparent 8%, rgba(255, 255, 255, 1) 50%, transparent 92%);

      --card: rgba(255, 255, 255, 0.68);
      --elevated: rgba(255, 255, 255, 0.62);
      --border: rgba(22, 24, 29, 0.11);
      --text: #16181D;
      --body-text: #2B2F38;
      --muted: #5A6270;
      --mint: #0B8F6C;
      --on-mint: #FFFFFF;
      --mint-dim: rgba(11, 143, 108, 0.12);
      --mint-border: rgba(11, 143, 108, 0.36);
      --gold: #B7791F;
      --gold-dim: rgba(183, 121, 31, 0.11);
      --gold-border: rgba(183, 121, 31, 0.35);
      --fest: #D13B3B;
      --fest-dim: rgba(209, 59, 59, 0.11);
      --fest-border: rgba(209, 59, 59, 0.35);
      --eka: #5B47D6;
      --eka-dim: rgba(91, 71, 214, 0.11);
      --eka-border: rgba(91, 71, 214, 0.35);
      --shukla: #94A0B2;
      --krishna: #7C4DFF;
      --warn: #D13B3B;
      --warn-dim: rgba(209, 59, 59, 0.11);
      --wk: rgba(22, 24, 29, 0.045);
      --tab-bg: rgba(255, 255, 255, 0.78);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans Devanagari", sans-serif;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--text);
      margin: 0; min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 20px) 14px calc(env(safe-area-inset-bottom) + 92px) 14px;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0;
      height: calc(env(safe-area-inset-top) + 10px);
      background: linear-gradient(180deg, var(--bg) 60%, transparent 100%);
      z-index: 90; pointer-events: none;
    }
    button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }

    /* Shared Liquid Glass Surface */
    .topbar, .card, .fest-banner, .mini-card, .mantra-card, .seg-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }
    .topbar::before, .card::before, .fest-banner::before, .mantra-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: var(--glass-sheen); pointer-events: none;
    }

    /* Large Font Mode (Elderly Friendly) */
    body.large-font .app-title { font-size: 19px; }
    body.large-font .app-sub { font-size: 13px; }
    body.large-font .fest-name { font-size: 19px; }
    body.large-font .fest-date { font-size: 14px; }
    body.large-font .month-title { font-size: 17px; }
    body.large-font .month-hindu { font-size: 13px; }
    body.large-font .day .num { font-size: 16px; }
    body.large-font .day .t { font-size: 10.5px; }
    body.large-font .card-head h3 { font-size: 18px; }
    body.large-font .row { font-size: 16px; padding: 9px 0; }
    body.large-font .rahu-box { font-size: 16px; }
    body.large-font .why-text { font-size: 16px; line-height: 1.65; }
    body.large-font .li-name { font-size: 16.5px; }
    body.large-font .li-sub { font-size: 14px; }
    body.large-font .mini-lbl { font-size: 12.5px; }
    body.large-font .mini-val { font-size: 16.5px; }
    body.large-font .hero-tithi { font-size: 22px; }
    body.large-font .hero-sub { font-size: 15px; }
    body.large-font .hero-year { font-size: 13.5px; }
    body.large-font .mantra-title { font-size: 17px; }
    body.large-font .mantra-text { font-size: 18.5px; line-height: 1.9; }
    body.large-font .exp-body { font-size: 15.5px; line-height: 1.65; }
    body.large-font .sec-title { font-size: 13.5px; }
    body.large-font .note { font-size: 13.5px; }
    body.large-font .act-btn, body.large-font .mini-link { font-size: 14px; }

    .topbar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
      padding: 10px 12px; gap: 6px; border-radius: 20px;
    }
    .brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .brand > div { min-width: 0; overflow: hidden; }
    .brand-icon { width: 30px; height: 30px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(91, 232, 190, 0.3)); }
    .app-title { font-size: 15px; font-weight: 800; letter-spacing: 0.1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-sub { font-size: 10.5px; color: var(--mint); font-weight: 600; margin-top: 2px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .icon-btn, .pill-btn {
      background: var(--glass-inner); color: var(--text); border: 1px solid var(--glass-border);
      border-radius: 16px; min-height: 32px; padding: 0 8px; font-size: 11.5px; font-weight: 700; cursor: pointer;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .icon-btn.active { background: var(--mint); color: var(--on-mint); border-color: var(--mint); }
    .pill-btn { color: var(--mint); }
    .pill-btn.dim { opacity: 0.45; }

    .view { display: none; animation: fadeIn 0.16s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    .card { border-radius: 22px; padding: 15px; margin-bottom: 13px; }

    .fest-banner {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      border-radius: 22px; padding: 13px 15px; margin-bottom: 13px; cursor: pointer;
      background: var(--glass-strong);
    }
    .fest-kicker { font-size: 11px; font-weight: 800; color: var(--mint); letter-spacing: 0.7px; text-transform: uppercase; }
    .fest-name { font-size: 16.5px; font-weight: 800; margin: 2px 0; }
    .fest-date { font-size: 12px; color: var(--muted); }
    .days-badge {
      background: var(--glass-inner); color: var(--text); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 8px 12px; text-align: center; min-width: 68px; flex-shrink: 0;
    }
    .days-badge .num { font-size: 18px; font-weight: 800; line-height: 1; color: var(--mint); }
    .days-badge .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 2px; color: var(--muted); }

    /* Calendar Header & Controls */
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
    .nav-btn {
      background: var(--glass-inner); color: var(--mint); border: 1px solid var(--glass-border-soft);
      border-radius: 12px; width: 42px; height: 42px; font-size: 20px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .month-meta { text-align: center; cursor: pointer; padding: 4px 8px; border-radius: 12px; }
    .month-meta:active { background: var(--glass-inner); }
    .month-title { font-size: 15.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .month-hindu { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .jump-bar { display: none; gap: 6px; margin-bottom: 10px; }
    .jump-bar.open { display: flex; }

    /* Calendar Grid: Glass cells, Silver (Shukla) & Purple (Krishna) top border only, Red font for all Festivals/Purnima/Amavasya */
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
    .dow { font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; letter-spacing: 0.4px; }
    .dow.wknd { color: var(--mint); }
    .day {
      background: var(--glass-inner); border: 1px solid var(--glass-border-soft); border-radius: 11px;
      padding: 4px 1px; cursor: pointer; min-width: 0; min-height: 54px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
      border-top: 3px solid var(--shukla); position: relative; overflow: hidden;
    }
    .day.krishna { border-top-color: var(--krishna); }
    .day.wknd-cell { background: var(--wk); }
    .day.today { box-shadow: 0 0 0 1.5px var(--mint) inset; }
    .day.selected { background: var(--mint); color: var(--on-mint); border-color: var(--mint); box-shadow: 0 4px 14px rgba(91, 232, 190, 0.35); }
    .day .num { font-size: 14px; font-weight: 700; line-height: 1.1; }
    .day .t {
      font-size: 9.5px; font-weight: 600; line-height: 1.15; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; width: 100%;
    }
    .day .t span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .day .t span.t-red { color: var(--warn); font-weight: 700; }
    .day.selected .t, .day.selected .t span.t-red { color: var(--on-mint); opacity: 1; }

    /* Details, Why This Day Matters & Cards */
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .card-head h3 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; color: var(--text); }
    .fest-tag {
      background: var(--fest-dim); color: var(--fest); border: 1px solid var(--fest-border);
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 12px; display: inline-block; margin: 2px 4px 2px 0;
    }
    .fest-tag.eka { background: var(--eka-dim); color: var(--eka); border-color: var(--eka-border); }
    .fest-tag.gold { background: var(--gold-dim); color: var(--gold); border-color: var(--gold-border); }
    .warn-tag {
      background: var(--warn-dim); color: var(--warn); border: 1px solid var(--warn);
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    }
    .row {
      font-size: 13.5px; display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .lbl { color: var(--muted); }
    .val { font-weight: 600; text-align: right; }
    .val.mint { color: var(--mint); font-weight: 700; }
    .val.warn { color: var(--warn); font-weight: 700; }

    .rahu-box {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      margin: 10px 0 8px; padding: 10px 12px; border-radius: 14px;
      background: var(--warn-dim); border: 1px solid rgba(255, 99, 99, 0.45); font-size: 13.5px;
    }
    .rahu-box b { color: var(--warn); }

    .why-card { border-left: 3px solid var(--mint); }
    .why-text { font-size: 13.5px; line-height: 1.6; color: var(--body-text); user-select: text; -webkit-user-select: text; }

    .act-row { display: flex; gap: 8px; margin-top: 12px; }
    .act-btn {
      flex: 1; background: var(--glass-inner); color: var(--mint); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 10px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: center;
    }

    .hero { display: flex; align-items: center; gap: 14px; }
    .moon-box {
      width: 58px; height: 58px; border-radius: 16px; background: var(--glass-inner);
      border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-tithi { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }
    .hero-sub { font-size: 12.5px; color: var(--mint); font-weight: 700; margin-top: 2px; }
    .hero-year { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 13px; }
    .mini-card { border-radius: 18px; padding: 13px; }
    .mini-lbl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .mini-val { font-size: 14.5px; font-weight: 700; margin-top: 4px; }
    .mini-val.mint { color: var(--mint); }
    .mini-val.warn { color: var(--warn); }

    .sec-title { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 8px 0 8px 4px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip {
      background: var(--glass-inner); border: 1px solid var(--glass-border-soft); color: var(--text);
      font-size: 12px; font-weight: 600; padding: 8px 12px; border-radius: 18px; cursor: pointer;
    }
    .chip.active { background: var(--mint-dim); border-color: var(--mint); color: var(--mint); }

    /* Single-row squeezed Quick Tithi & Muhurat Chips */
    #quickChips, #muhuratChips {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-bottom: 10px;
    }
    #quickChips .chip, #muhuratChips .chip {
      padding: 7px 2px; font-size: 10px; border-radius: 12px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .select-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-bottom: 12px; }

    /* Single-row non-overlapping Astro Date & Time Controls */
    .astro-controls { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.95fr) auto; gap: 6px; align-items: center; margin-bottom: 12px; }
    .astro-controls input[type="date"], .astro-controls input[type="time"] {
      padding: 8px 4px; font-size: 12px; min-height: 40px; min-width: 0; width: 100%; overflow: hidden; text-align: center;
    }
    .astro-controls .reset-btn { padding: 0 10px; min-height: 40px; font-size: 12px; }
    select, input[type="date"], input[type="time"], input[type="search"] {
      background: var(--glass-inner); color: var(--text); border: 1px solid var(--glass-border-soft);
      border-radius: 12px; padding: 10px 10px; font-size: 13.5px; font-weight: 600;
      width: 100%; max-width: 100%; min-width: 0; outline: none; min-height: 42px;
      -webkit-appearance: none; appearance: none;
    }
    .reset-btn {
      background: var(--glass-inner); color: var(--mint); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 0 16px; min-height: 42px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .finder-result {
      background: var(--glass-inner); border: 1px solid var(--mint-border); border-radius: 16px;
      padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .li-name { font-size: 14px; font-weight: 700; }
    .li-sub { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .li-badge {
      background: var(--glass-inner); color: var(--mint); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 5px 10px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
    }

    .exp-wrap { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .exp-wrap:last-child { border-bottom: none; padding-bottom: 0; }
    .exp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; min-height: 44px; }
    .exp-body {
      display: none; margin-top: 8px; padding: 11px 12px; border-radius: 14px;
      background: var(--glass-inner); border-left: 3px solid var(--mint); font-size: 12.5px; line-height: 1.55; color: var(--body-text);
    }
    .exp-wrap.open .exp-body { display: block; }
    .mini-link {
      display: inline-block; margin-top: 8px; margin-right: 6px; padding: 7px 11px; border-radius: 10px;
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      font-size: 11.5px; font-weight: 700; cursor: pointer;
    }

    .seg-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      border-radius: 16px; padding: 4px; margin-bottom: 12px;
    }
    .seg-btn { padding: 10px; text-align: center; font-size: 12.5px; font-weight: 700; border-radius: 12px; color: var(--muted); cursor: pointer; }
    .seg-btn.active { background: var(--mint); color: var(--on-mint); }
    .mantra-card {
      border-radius: 18px; padding: 15px; margin-bottom: 11px;
      user-select: text; -webkit-user-select: text;
    }
    .mantra-title { font-size: 14px; font-weight: 800; color: var(--mint); margin-bottom: 6px; }
    .mantra-text { font-size: 15.5px; line-height: 1.8; color: var(--text); white-space: pre-line; }
    .vidhi-steps { margin: 6px 0 0 18px; padding: 0; }
    .vidhi-steps li { margin-bottom: 6px; }

    .note { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 8px; }

    /* Floating Frosted Glass Pill Navigation Dock */
    .tabbar {
      position: fixed; bottom: calc(env(safe-area-inset-bottom) + 8px); left: 10px; right: 10px;
      background: var(--tab-bg);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px;
      padding: 5px; z-index: 100;
    }
    .tab {

      { title:"श्री विष्णु मन्त्रः", text:"शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं\nविश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम्।\nलक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यं\nवन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्॥" },
      { title:"श्री हनुमान वन्दना", text:"मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम्।\nवातात्मजं वानरयूथमुख्यं श्रीरामदूतं शरणं प्रपद्ये॥" },
      { title:"श्री लक्ष्मी मन्त्रः", text:"ॐ श्रीं ह्रीं श्रीं कमले कमलालये प्रसीद प्रसीद।\nॐ श्रीं ह्रीं श्रीं महालक्ष्म्यै नमः॥" },
      { title:"श्री सरस्वती वन्दना", text:"या कुन्देन्दुतुषारहारधवला या शुभ्रवस्त्रावृता\nया वीणावरदण्डमण्डितकरा या श्वेतपद्मासना।\nया ब्रह्माच्युतशङ्करप्रभृतिभिर्देवैः सदा वन्दिता\nसा मां पातु सरस्वती भगवती निःशेषजाड्यापहा॥" },
      { title:"श्री शिव ध्यानम्", text:"कर्पूरगौरं करुणावतारं संसारसारं भुजगेन्द्रहारम्।\nसदा वसन्तं हृदयारविन्दे भवं भवानीसहितं नमामि॥" },
      { title:"गुरु वन्दना", text:"गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः।\nगुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः॥" },
      { title:"नवग्रह शान्ति मन्त्रः", text:"ब्रह्मा मुरारिस्त्रिपुरान्तकारी भानुः शशी भूमिसुतो बुधश्च।\nगुरुश्च शुक्रः शनिराहुकेतवः सर्वे ग्रहाः शान्तिकरा भवन्तु॥" },
      { title:"श्री कृष्ण वन्दना", text:"वसुदेवसुतं देवं कंसचाणूरमर्दनम्।\nदेवकीपरमानन्दं कृष्णं वन्दे जगद्गुरुम्॥" },
      { title:"दीप प्रज्वलन मन्त्रः", text:"शुभं करोति कल्याणमारोग्यं धनसम्पदा।\nशत्रुबुद्धिविनाशाय दीपज्योतिर्नमोऽस्तु ते॥" },
      { title:"तुलसी प्रणाम मन्त्रः", text:"वृन्दायै तुलसीदेव्यै प्रियायै केशवस्य च।\nविष्णुभक्तिप्रदे देवि सत्यवत्यै नमो नमः॥" },
      { title:"पवित्रता / आचमन मन्त्रः", text:"ॐ अपवित्रः पवित्रो वा सर्वावस्थां गतोऽपि वा।\nयः स्मरेत् पुण्डरीकाक्षं स बाह्याभ्यन्तरः शुचिः॥" },
      { title:"क्षमा प्रार्थना", text:"आवाहनं न जानामि न जानामि विसर्जनम्।\nपूजां चैव न जानामि क्षमस्व परमेश्वर॥" },
      { title:"शान्ति पाठः", text:"ॐ सर्वे भवन्तु सुखिनः सर्वे सन्तु निरामयाः।\nसर्वे भद्राणि पश्यन्तु मा कश्चिद्दुःखभाग्भवेत्॥\nॐ शान्तिः शान्तिः शान्तिः॥" }
    ];

    const MAITHIL_VIDHIS = [
      { enTitle:"Nitya Dev Puja (Mithila)", hiTitle:"नित्य देव पूजा (मिथिला परंपरा)", enSub:"Daily Gosain Ghar worship", hiSub:"दैनिक गोसाउन घर पूजा",

      { enTitle:"Chaurchan (Chauth Chandra)", hiTitle:"चौरचन (चौथ चंद्र पूजा)", enSub:"Bhadrapada Shukla Chaturthi (Mithila)", hiSub:"भाद्रपद शुक्ल चतुर्थी (मिथिला)",

      { enTitle:"Chhath Puja (Mithila Vidhi)", hiTitle:"छठ पूजा (मिथिला विधि)", enSub:"Kartika Shukla Chaturthi to Saptami", hiSub:"कार्तिक शुक्ल चतुर्थी से सप्तमी",

      { enTitle:"Kojagara (Sharad Purnima)", hiTitle:"कोजागरा (शरद पूर्णिमा लक्ष्मी पूजा)", enSub:"Ashwin Shukla Purnima (Mithila)", hiSub:"आश्विन शुक्ल पूर्णिमा (मिथिला)",
        enSteps:["Aripan & Kalash: Draw Ashtadal Kamal Aripan in the evening and establish a Kalash.","Lakshmi Puja: Worship Goddess Lakshmi and Indra at night with white flowers, Makhana, Paan, Supari, and Batasha.","Jagaran: Stay awake during the night ('Ko Jagarti'), traditionally playing Pachisi.","Chumavan & Distribution: In newlywed Maithil homes, perform Chumavan and distribute Makhana, Paan, and Supari."],

      { enTitle:"Jitiya Vrat (Jivitputrika)", hiTitle:"जितिया व्रत (जीवित्पुत्रिका)", enSub:"Ashwin Krishna Ashtami (Mithila)", hiSub:"आश्विन कृष्ण अष्टमी (मिथिला)",

      { enTitle:"Vat Savitri (Barasait)", hiTitle:"वट सावित्री (बरसाइत)", enSub:"Jyeshtha Amavasya (Mithila)", hiSub:"ज्येष्ठ अमावस्या (मिथिला)",
        enSteps:["Preparation: Prepare bamboo hand-fan (Bena), soaked gram, mango, and litchi.","Banyan Tree Puja: Tie raw cotton thread around the Vat tree while circumambulating 7 times.","Katha: Listen to Savitri-Satyavan Katha under the tree and offer seasonal fruits.","Blessings: Fan the husband with the bamboo Bena and seek elders' blessings."],

      { enTitle:"Madhushravani Puja", hiTitle:"मधुश्रावणी पूजा (मिथिला)", enSub:"Shravana Krishna Panchami to Shukla Tritiya", hiSub:"श्रावण कृष्ण पंचमी से शुक्ल तृतीया",

      { enTitle:"Sama Chakeva", hiTitle:"समा-चकेवा (मिथिला)", enSub:"Kartika Shukla Saptami to Purnima", hiSub:"कार्तिक शुक्ल सप्तमी से पूर्णिमा",

      { enTitle:"Saraswati Puja (Vasant Panchami)", hiTitle:"सरस्वती पूजा (वसंत पंचमी)", enSub:"Magha Shukla Panchami", hiSub:"माघ शुक्ल पंचमी",
        enSteps:["Sthapana: Place Maa Saraswati's idol on yellow/white cloth over Aripan with books nearby.","Kalash & Puja: Offer marigold flowers, white Chandan, Akshat, and seasonal Ber fruit.","Pushpanjali: Recite Saraswati Vandana and offer Pushpanjali.","Aarti & Prasad: Distribute Boondi, Ber, and Kheer Prasad."],

      { enTitle:"Satyanarayan Puja (Mithila)", hiTitle:"श्री सत्यनारायण पूजा (मैथिल विधि)", enSub:"Purnima, Ekadashi or Sankranti", hiSub:"पूर्णिमा, एकादशी या संक्रांति",
        enSteps:["Mandap & Aripan: Draw Aripan, set Chauki with yellow cloth and Kalash with mango leaves and coconut.","Sankalp & Ganesh-Gauri Puja: Take Sankalp with water, Akshat, and Kusha; invoke Ganesh, Gauri, and Navagraha.","Vishnu Puja: Perform Shodashopachar Puja of Lord Satyanarayan with Tulsi leaves.","Katha & Prasad: Listen to all 5 chapters, offer Panjiri and Charanamrit, then perform Aarti."],

    /* ======================= Precision Astronomy + Offline Fallback ======================= */
    const HAS_ASTRO = typeof Astronomy !== "undefined";
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const norm = d => ((d % 360) + 360) % 360;
    const getJD = dt => dt.getTime() / 86400000 + 2440587.5;
    const getAyanamsa = dt => 23.853 + 0.013969 * ((getJD(dt) - 2451545.0) / 365.25);

    const PLANET_ELEMS = {
      Mercury:{ a:0.38710, e:0.20563, i:7.005, O:48.331,  w:29.124,  M0:174.796, n:4.09233445 },
      Venus:  { a:0.72333, e:0.00677, i:3.395, O:76.680,  w:54.884,  M0:50.115,  n:1.60213034 },
      Mars:   { a:1.52368, e:0.09340, i:1.850, O:49.558,  w:286.502, M0:19.373,  n:0.52403900 },
      Jupiter:{ a:5.20260, e:0.04849, i:1.303, O:100.464, w:273.867, M0:20.020,  n:0.08309121 },
      Saturn: { a:9.55491, e:0.05551, i:2.489, O:113.665, w:339.392, M0:317.020, n:0.03345965 }
    };
    function helioXY(el, d) {
      const M = toRad(norm(el.M0 + el.n * d));
      let E = M + el.e * Math.sin(M);
      for (let k = 0; k < 4; k++) E = E - (E - el.e * Math.sin(E) - M) / (1 - el.e * Math.cos(E));
      const xv = el.a * (Math.cos(E) - el.e), yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
      const v = Math.atan2(yv, xv), r = Math.hypot(xv, yv);
      const O = toRad(el.O), w = toRad(el.w), i = toRad(el.i);
      return {
        x: r * (Math.cos(O) * Math.cos(v + w) - Math.sin(O) * Math.sin(v + w) * Math.cos(i)),
        y: r * (Math.sin(O) * Math.cos(v + w) + Math.cos(O) * Math.sin(v + w) * Math.cos(i))
      };
    }

    function getSunLon(dt) {
      if (HAS_ASTRO) return norm(Astronomy.SunPosition(dt).elon);
      const n = getJD(dt) - 2451545.0;
      const L = norm(280.460 + 0.9856474 * n), g = toRad(norm(357.528 + 0.9856003 * n));
      return norm(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g));
    }

    function getMoonLon(dt) {
      if (HAS_ASTRO) return norm(Astronomy.EclipticGeoMoon(dt).lon);
      const d = getJD(dt) - 2451543.5;
      const N = norm(125.1228 - 0.0529538083 * d), w = norm(318.0634 + 0.1643573223 * d);
      const M = norm(115.3654 + 13.0649929509 * d), L = norm(N + w + M);
      const Ms = norm(356.0470 + 0.9856002585 * d), Ls = norm(282.9404 + 4.70935e-5 * d + Ms);
      const D = norm(L - Ls), F = norm(L - N);
      return norm(L + 6.289 * Math.sin(toRad(M)) - 1.274 * Math.sin(toRad(M - 2 * D))
        + 0.658 * Math.sin(toRad(2 * D)) + 0.214 * Math.sin(toRad(2 * M))
        - 0.186 * Math.sin(toRad(Ms)) - 0.114 * Math.sin(toRad(2 * F)));
    }

    function getPlanetLon(name, dt) {
      if (name === "Sun") return getSunLon(dt);
      if (name === "Moon") return getMoonLon(dt);
      const d = getJD(dt) - 2451545.0;
      if (name === "Rahu") return norm(125.0445 - 0.05295377 * d);
      if (name === "Ketu") return norm(125.0445 - 0.05295377 * d + 180);
      if (HAS_ASTRO) {
        const vec = Astronomy.GeoVector(name, dt, true);
        if (Astronomy.Rotation_EQJ_ECT && Astronomy.RotateVector) {
          const ect = Astronomy.RotateVector(Astronomy.Rotation_EQJ_ECT(dt), vec);
          return norm(toDeg(Math.atan2(ect.y, ect.x)));
        }
        const precess = 0.013969 * ((getJD(dt) - 2451545.0) / 365.25);
        return norm(Astronomy.Ecliptic(vec).elon + precess);
      }
      const sunLon = toRad(getSunLon(dt));
      const ex = -Math.cos(sunLon), ey = -Math.sin(sunLon);
      const p = helioXY(PLANET_ELEMS[name], d);
      return norm(toDeg(Math.atan2(p.y - ey, p.x - ex)));
    }

    function getSiderealLagna(dt) {
      const jd = getJD(dt);
      const gmst = norm(280.46061837 + 360.98564736629 * (jd - 2451545.0));
      const lst = toRad(norm(gmst + LON));
      const eps = toRad(23.4393);
      const phi = toRad(LAT);
      const tropAsc = norm(toDeg(Math.atan2(Math.cos(lst), -(Math.sin(lst) * Math.cos(eps) + Math.tan(phi) * Math.sin(eps)))));
      const sidAsc = norm(tropAsc - getAyanamsa(dt));
      return { rashiIdx: Math.floor(sidAsc / 30), deg: (sidAsc % 30).toFixed(1) };
    }

    function findPhaseTime(refDate, targetDeg) {
      if (HAS_ASTRO) {
        const t = Astronomy.SearchMoonPhase(targetDeg, new Date(refDate.getTime() - 28 * 3600000), 3);
        if (t) return t.date;
      }
      let ms = refDate.getTime();
      for (let i = 0; i < 10; i++) {
        const dt = new Date(ms);
        const diff = norm(getMoonLon(dt) - getSunLon(dt));
        const err = ((targetDeg - diff + 540) % 360) - 180;
        ms += (err / 12.19075) * 86400000;
      }
      return new Date(ms);
    }

    function getRiseSet(y, m, d) {
      const k = `RS-${y}-${m}-${d}-${locKey}`;
      if (memo.has(k)) return memo.get(k);
      const base = new Date(y, m, d, 0, 0, 0);
      let sr = null, ss = null, mr = null, ms = null;
      if (HAS_ASTRO) {
        const obs = new Astronomy.Observer(LAT, LON, 0);
        const r1 = Astronomy.SearchRiseSet("Sun", obs, +1, base, 1);
        const s1 = Astronomy.SearchRiseSet("Sun", obs, -1, base, 1);
        const r2 = Astronomy.SearchRiseSet("Moon", obs, +1, base, 1);
        const s2 = Astronomy.SearchRiseSet("Moon", obs, -1, base, 1);
        if (r1) sr = r1.date;
        if (s1) ss = s1.date;
        if (r2) mr = r2.date;
        if (s2) ms = s2.date;
      }
      if (!sr || !ss) {
        const doy = Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 86400000);
        const B = toRad((360 / 365) * (doy - 81));
        const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
        const decl = toRad(23.45 * Math.sin(B));
        const cosH = (Math.cos(toRad(90.833)) - Math.sin(toRad(LAT)) * Math.sin(decl)) / (Math.cos(toRad(LAT)) * Math.cos(decl));
        const H = toDeg(Math.acos(Math.max(-1, Math.min(1, cosH)))) * 4;
        const noonMin = 720 - 4 * LON - eot;
        const utcBase = Date.UTC(y, m, d);
        sr = new Date(utcBase + Math.round(noonMin - H) * 60000);
        ss = new Date(utcBase + Math.round(noonMin + H) * 60000);
      }
      const seg = (ss - sr) / 8, dow = base.getDay();
      const mid = new Date((sr.getTime() + ss.getTime()) / 2);
      const rahuSeg = [7,1,6,4,5,3,2][dow], yamaSeg = [4,3,2,1,0,6,5][dow], gulikaSeg = [6,5,4,3,2,1,0][dow];
      const res = {
        sunrise: sr, sunset: ss, noon: mid, moonrise: mr, moonset: ms,
        brahmaStart: new Date(sr.getTime() - 96 * 60000), brahmaEnd: new Date(sr.getTime() - 48 * 60000),
        pradoshStart: ss, pradoshEnd: new Date(ss.getTime() + 144 * 60000),
        abhijitStart: new Date(mid.getTime() - 24 * 60000), abhijitEnd: new Date(mid.getTime() + 24 * 60000),
        rahuStart: new Date(sr.getTime() + rahuSeg * seg), rahuEnd: new Date(sr.getTime() + (rahuSeg + 1) * seg),
        yamaStart: new Date(sr.getTime() + yamaSeg * seg), yamaEnd: new Date(sr.getTime() + (yamaSeg + 1) * seg),
        gulikaStart: new Date(sr.getTime() + gulikaSeg * seg), gulikaEnd: new Date(sr.getTime() + (gulikaSeg + 1) * seg)
      };
      memo.set(k, res);
      return res;
    }

    function getKaranaKey(diff) {
      const k = Math.floor(diff / 6);
      if (k === 0) return "Kimstughna";
      if (k === 57) return "Shakuni";
      if (k === 58) return "Chatushpada";
      if (k === 59) return "Naga";
      return KARANAS_MOV[(k - 1) % 7];
    }

    /* ======================= Exact Cached Lunations & Instant Panchang ======================= */
    const LUNATIONS = [];
    function findNewMoonMs(approxDate) {
      if (HAS_ASTRO) {
        const t = Astronomy.SearchMoonPhase(0, new Date(approxDate.getTime() - 2 * 86400000), 5);
        if (t) return t.date.getTime();
      }
      return findPhaseTime(approxDate, 0).getTime();
    }
    function getLunation(dt) {
      const ms = dt.getTime();
      for (let i = 0; i < LUNATIONS.length; i++) {
        const L = LUNATIONS[i];
        if (ms >= L.start && ms < L.end) return L;
      }
      const diff = norm(getMoonLon(dt) - getSunLon(dt));
      let s = findNewMoonMs(new Date(ms - (diff / 12.19075) * 86400000));
      if (s > ms) s = findNewMoonMs(new Date(s - 29.53059 * 86400000));
      let e = findNewMoonMs(new Date(s + 29.53059 * 86400000));
      while (ms >= e) { s = e; e = findNewMoonMs(new Date(s + 29.53059 * 86400000)); }
      const sDt = new Date(s), eDt = new Date(e);
      const r1 = Math.floor(norm(getSunLon(sDt) - getAyanamsa(sDt)) / 30);
      const r2 = Math.floor(norm(getSunLon(eDt) - getAyanamsa(eDt)) / 30);
      const L = { start: s, end: e, amantaIdx: (r1 + 1) % 12, isAdhika: r1 === r2 };
      LUNATIONS.push(L);
      return L;
    }

    function astroAt(dt) {
      const ayan = getAyanamsa(dt), sun = getSunLon(dt), moon = getMoonLon(dt);
      const sunSid = norm(sun - ayan), moonSid = norm(moon - ayan), diff = norm(moon - sun);
      const tithiIdx = Math.floor(diff / 12);
      const lun = getLunation(dt);
      const isAdhika = lun.isAdhika;
      const amantaIdx = lun.amantaIdx;
      const masaIdx = (tithiIdx < 15 || isAdhika) ? amantaIdx : (amantaIdx + 1) % 12; // Purnimanta Mithila
      return {
        dt, sun, moon, sunSid, moonSid, diff,
        tithiIdx, pakshaKey: tithiIdx < 15 ? "shukla" : "krishna",
        nakIdx: Math.floor(moonSid / (360 / 27)),
        yogaIdx: Math.floor(norm(sunSid + moonSid) / (360 / 27)),
        karanaKey: getKaranaKey(diff),
        sunRashiIdx: Math.floor(sunSid / 30), moonRashiIdx: Math.floor(moonSid / 30),
        amantaIdx, masaIdx, isAdhika,
        illum: Math.round(((1 - Math.cos(toRad(diff))) / 2) * 100)
      };
    }

    /* ======================= Scriptural Festival Decision Engine ======================= */
    const RULE_TIME = {
      pratah:   st => new Date(st.sunrise.getTime() + 3 * 3600000),
      aparahna: st => new Date(st.noon.getTime() + 2 * 3600000),
      sunrise:  st => st.sunrise,
      noon:     st => st.noon,
      sunset:   st => st.sunset,
      pradosh:  st => new Date(st.sunset.getTime() + 45 * 60000),
      nishita:  st => new Date(st.noon.getTime() + 12 * 3600000),
      moonrise: st => st.moonrise || new Date(st.sunset.getTime() + 60 * 60000)
    };

    function ruleCheck(y, m, d, rule) {
      const k = `RC-${rule}-${y}-${m}-${d}-${locKey}`;
      if (memo.has(k)) return memo.get(k);
      const st = getRiseSet(y, m, d);
      const a = astroAt(RULE_TIME[rule](st));
      const r = { tithi: a.tithiIdx, amanta: a.amantaIdx, adhika: a.isAdhika };
      memo.set(k, r);
      return r;
    }

    function computeFestKeys(y, m, d) {
      const k = `FK-${y}-${m}-${d}-${locKey}`;
      if (memo.has(k)) return memo.get(k);
      const keys = [], rules = new Set(["sunrise", ...Object.values(FEST_RULE)]);
      const prevD = new Date(y, m, d - 1), nextD = new Date(y, m, d + 1);

      for (const rule of rules) {
        const cur = ruleCheck(y, m, d, rule);
        if (cur.adhika) continue;
        const fKey = `${cur.amanta}-${cur.tithi}`;
        if (!isFestKey(fKey) || (FEST_RULE[fKey] || "sunrise") !== rule) continue;
        const prev = ruleCheck(prevD.getFullYear(), prevD.getMonth(), prevD.getDate(), rule);
        if (!prev.adhika && `${prev.amanta}-${prev.tithi}` === fKey) continue;
        keys.push(fKey);
      }

      // Kshaya tithi (skipped between two sunrises)
      const c0 = ruleCheck(y, m, d, "sunrise");
      const c1 = ruleCheck(nextD.getFullYear(), nextD.getMonth(), nextD.getDate(), "sunrise");
      if (!c0.adhika && (c1.tithi - c0.tithi + 30) % 30 === 2) {
        const tk = (c0.tithi + 1) % 30, kk = `${c0.amanta}-${tk}`;
        if (tk !== 0 && isFestKey(kk) && (FEST_RULE[kk] || "sunrise") === "sunrise" && !keys.includes(kk)) keys.push(kk);
      }

      // Dynamic Makar Sankranti (Sun enters sidereal Makara 270 deg)
      const ssNow = astroAt(getRiseSet(y, m, d).sunset).sunSid;
      const ssPrev = astroAt(getRiseSet(prevD.getFullYear(), prevD.getMonth(), prevD.getDate()).sunset).sunSid;
      if (ssNow >= 270 && ssNow < 300 && ssPrev < 270) keys.push("makar");

      memo.set(k, keys);
      return keys;
    }

    function getDayPanchang(y, m, d, includeExtras = false) {
      const k = `DP-${y}-${m}-${d}-${includeExtras?1:0}-${locKey}`;
      if (memo.has(k)) return memo.get(k);
      const st = getRiseSet(y, m, d);
      const aSR = astroAt(st.sunrise), aPM = astroAt(st.sunset), aNoon = astroAt(st.noon);
      const vikramSamvat = (m < 4 && aSR.amantaIdx >= 8) ? y + 56 : y + 57;
      const keys = computeFestKeys(y, m, d);
      const festKey = keys.find(isMajor) || keys[0] || null;
      const res = {
        ...aSR, y, m, d, dow: new Date(y, m, d).getDay(), st, noon: aNoon, pm: aPM,
        tithiAM: aSR.tithiIdx, tithiPM: aPM.tithiIdx, nakPM: aPM.nakIdx,
        hasDualTithi: aSR.tithiIdx !== aPM.tithiIdx,
        vikramSamvat, shakaSamvat: vikramSamvat - 135,
        rituIdx: Math.floor(aSR.masaIdx / 2),
        ayanaIdx: (aSR.sunSid >= 270 || aSR.sunSid < 90) ? 0 : 1,
        keys, festKey
      };
      if (includeExtras) {
        res.tithiStart = findPhaseTime(st.sunrise, aSR.tithiIdx * 12);
        res.tithiEnd = findPhaseTime(st.sunrise, ((aSR.tithiIdx + 1) * 12) % 360);
        if (res.hasDualTithi) {
          res.tithiPMStart = findPhaseTime(st.sunset, aPM.tithiIdx * 12);
          res.tithiPMEnd = findPhaseTime(st.sunset, ((aPM.tithiIdx + 1) * 12) % 360);
        }
      }
      memo.set(k, res);
      return res;
    }

    function getObservances(p) {
      const out = [];
      p.keys.forEach(k => out.push({ key: k, text: festName(k), kind: isEkaKey(k) ? "eka" : "fest" }));
      if ((p.tithiAM === 14 || p.tithiPM === 14) && !p.keys.some(k => /-14$/.test(k)))
        out.push({ key: null, text: `${MASAS[lang][p.masaIdx]} ${lang === "hi" ? "पूर्णिमा" : "Purnima"}`, kind: "gold" });
      if ((p.tithiAM === 29 || p.tithiPM === 29) && !p.keys.some(k => /-29$/.test(k)))
        out.push({ key: null, text: `${MASAS[lang][p.masaIdx]} ${lang === "hi" ? "अमावस्या" : "Amavasya"}`, kind: "gold" });
      return out;
    }

    function getDayExplainer(p, activeAstro = null) {
      const hi = lang === "hi";
      const ref = activeAstro || p;
      const t = ref.tithiIdx;
      const pk = ref.pakshaKey;
      const mIdx = ref.masaIdx;
      const nIdx = ref.nakIdx;

      // Check if current/active tithi matches a festival explainer
      const activeFestKey = `${ref.amantaIdx}-${t}`;
      if (!ref.isAdhika && EXPLAINERS[activeFestKey]) return EXPLAINERS[activeFestKey][lang];
      if (!activeAstro) {
        const fk = p.keys.find(k => EXPLAINERS[k]);
        if (fk) return EXPLAINERS[fk][lang];
      } else if (p.keys.includes("makar")) {
        return EXPLAINERS["makar"][lang];
      }

      if (ref.isAdhika) return I18N[lang].adhikaNote;
      if (t === 10 || t === 25) {
        const ekaObj = EKADASHI[activeFestKey] || LUNAR_FESTIVALS[activeFestKey];
        const nm = ekaObj ? ekaObj[lang] : (hi ? "एकादशी" : "Ekadashi");
        return hi
          ? `${nm} भगवान विष्णु को समर्पित है; मानसिक शुद्धि, भक्ति और आध्यात्मिक अनुशासन हेतु उपवास रखा जाता है।`
          : `${nm} is dedicated to Lord Vishnu; traditionally observed with fasting and devotion for spiritual clarity.`;
      }
      if (t === 14) return hi ? "पूर्णिमा (पूर्ण चंद्र) सत्यनारायण कथा, ध्यान और दान-पुण्य के लिए अत्यंत शुभ मानी जाती है।" : "Purnima (Full Moon) amplifies lunar energy; auspicious for Satyanarayan Puja, meditation, and charity.";
      if (t === 29) return hi ? "अमावस्या पितृ तर्पण, पूर्वजों के स्मरण और शांत आत्मचिंतन के लिए समर्पित होती है।" : "Amavasya (New Moon) is dedicated to honoring ancestors (Pitru Tarpan) and quiet introspection.";
      if (t === 12 || t === 27) return hi ? "प्रदोष व्रत (त्रयोदशी) भगवान शिव को समर्पित है, विशेषकर सूर्यास्त के बाद प्रदोष काल में।" : "Pradosh Vrat (Trayodashi) is dedicated to Lord Shiva, especially observed during twilight after sunset.";
      if (t === 18) return hi ? "संकष्टी चतुर्थी भगवान गणेश को समर्पित है; विघ्न निवारण हेतु चंद्रोदय तक व्रत रखा जाता है।" : "Sankashti Chaturthi is dedicated to Lord Ganesha; devotees fast until moonrise for obstacle removal.";
      return hi
        ? `${MASAS.hi[mIdx]} मास के ${I18N.hi[pk]} पक्ष की ${TITHIS.hi[t]} एवं ${NAKSHATRAS.hi[nIdx]} नक्षत्र—दैनिक पूजा, स्वाध्याय व नियमित कार्यों के लिए उपयुक्त।`
        : `${I18N.en[pk]} ${TITHIS.en[t]} in ${MASAS.en[mIdx]} Masa under ${NAKSHATRAS.en[nIdx]} Nakshatra—suitable for routine spiritual practice and daily duties.`;
    }

    function getDoshas(a) {
      const list = [], hi = lang === "hi";
      if ([22,23,24,25,26].includes(a.nakIdx)) list.push(hi ? "पंचक" : "Panchak");
      if ([0,8,9,17,18,26].includes(a.nakIdx)) list.push(hi ? "गंडमूल" : "Gandmool");
      if (a.karanaKey === "Vishti") list.push(hi ? "भद्रा" : "Bhadra");
      if (a.yogaIdx === 16) list.push(hi ? "व्यतीपात" : "Vyatipata");
      if (a.yogaIdx === 26) list.push(hi ? "वैधृति" : "Vaidhriti");
      return list;
    }

    /* ======================= Formatting Helpers ======================= */
    const pad = n => String(n).padStart(2, "0");
    function fmtTime(dt) {
      if (!dt) return "—";
      try {
        return new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true }).format(dt);
      } catch {
        const h = dt.getHours();
        return `${h % 12 || 12}:${pad(dt.getMinutes())} ${h >= 12 ? "PM" : "AM"}`;
      }
    }
    function fmtShortDate(dt) { const L = I18N[lang]; return `${L.gDaysShort[dt.getDay()]}, ${dt.getDate()} ${L.gMonthsShort[dt.getMonth()]} ${dt.getFullYear()}`; }
    function fmtFullDate(dt) { const L = I18N[lang]; return `${L.gDays[dt.getDay()]}, ${dt.getDate()} ${L.gMonths[dt.getMonth()]} ${dt.getFullYear()}`; }
    function fmtDT(dt) { return dt ? `${dt.getDate()} ${I18N[lang].gMonthsShort[dt.getMonth()]}, ${fmtTime(dt)}` : "—"; }
    function fmtDays(n) { const L = I18N[lang]; return n === 0 ? L.today : (n === 1 ? `1 ${L.day}` : `${n} ${L.days}`); }
    const localISO = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const localTimeISO = dt => `${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    const masaLabel = p => `${p.isAdhika ? I18N[lang].adhika + " " : ""}${MASAS[lang][p.masaIdx]}`;

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
    }

    function shareText(text) {
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast(I18N[lang].copied)).catch(() => {});
    }

    /* ======================= ICS & Share ======================= */
    function buildICS(events) {
      const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
      const out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mithila Calendar//EN", "CALSCALE:GREGORIAN"];
      events.forEach((e, i) => {
        const dt = e.date, next = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1);
        const d1 = `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
        const d2 = `${next.getFullYear()}${pad(next.getMonth()+1)}${pad(next.getDate())}`;
        out.push("BEGIN:VEVENT", `UID:mc-${d1}-${i}@mithila-cal`, `DTSTAMP:${stamp}`,
          `DTSTART;VALUE=DATE:${d1}`, `DTEND;VALUE=DATE:${d2}`,
          `SUMMARY:${e.title.replace(/[\\;,]/g, "\\$&")}`, `DESCRIPTION:${(e.desc || "").replace(/[\\;,]/g, "\\$&")}`, "END:VEVENT");
      });
      out.push("END:VCALENDAR");
      return out.join("\r\n");
    }
    function downloadICS(events, filename) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([buildICS(events)], { type: "text/calendar;charset=utf-8" }));
      a.download = filename; a.click();
      toast(I18N[lang].calSaved);
    }
    function exportSelectedICS() {
      const p = getDayPanchang(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), false);
      const obs = getObservances(p), L = I18N[lang];
      const title = obs.length ? obs.map(o => o.text).join(" / ") : `${L[p.pakshaKey]} ${TITHIS[lang][p.tithiAM]}`;
      downloadICS([{ date: selectedDate, title, desc: `${masaLabel(p)} • ${L[p.pakshaKey]} ${TITHIS[lang][p.tithiAM]} • ${NAKSHATRAS[lang][p.nakIdx]}` }], "mithila-event.ics");
    }
    function exportUpcomingICS() {
      const list = getUpcomingEvents().filter(f => f.days <= 365).slice(0, 80);
      downloadICS(list.map(f => ({ date: f.date, title: festName(f.key), desc: `${masaLabel(f.p)} • ${I18N[lang][f.p.pakshaKey]} ${TITHIS[lang][f.p.tithiAM]}` })), "mithila-festivals.ics");
    }
    function shareSelectedDay() {
      const p = getDayPanchang(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), false);
      const L = I18N[lang], obs = getObservances(p), st = p.st;
      const text = `${fmtFullDate(selectedDate)}\n${masaLabel(p)} • ${L[p.pakshaKey]} ${TITHIS[lang][p.tithiAM]} • ${NAKSHATRAS[lang][p.nakIdx]}\n` +
        (obs.length ? obs.map(o => "★ " + o.text).join("\n") + "\n" : "") +
        `${L.rahuKaal}: ${fmtTime(st.rahuStart)} – ${fmtTime(st.rahuEnd)}`;
      shareText(text);
    }
    function shareVidhi(idx) {
      const v = MAITHIL_VIDHIS[idx];
      if (!v) return;
      const title = lang === "hi" ? v.hiTitle : v.enTitle;
      const sub = lang === "hi" ? v.hiSub : v.enSub;
      const steps = (lang === "hi" ? v.hiSteps : v.enSteps).map((s, i) => `${i + 1}. ${s}`).join("\n");
      shareText(`${title}\n(${sub})\n\n${steps}\n\n— Mithila Calendar`);
    }

    /* ======================= Silent Auto-GPS (Fallback: Madhubani) ======================= */
    function initAutoLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        const nLat = pos.coords.latitude, nLon = pos.coords.longitude;
        if (Math.abs(nLat - LAT) > 0.05 || Math.abs(nLon - LON) > 0.05) {
          LAT = nLat; LON = nLon;
          TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
          locKey = `${LAT.toFixed(3)},${LON.toFixed(3)}`;
          sSet("mc_lat", LAT); sSet("mc_lon", LON); sSet("mc_tz", TZ);
          memo.clear(); upCache = null; renderedTabs.clear();
          renderActiveView();
        }
      }, () => {
        // Keep stored or default Madhubani silently
      }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 3600000 });
    }

    /* ======================= State & Upcoming Events ======================= */
    let viewDate = new Date(), selectedDate = new Date();
    let finderPaksha = "Any", finderTithi = 10, activeQuickIdx = 0;

    function getUpcomingEvents() {
      const todayKey = `${localISO(new Date())}-${locKey}`;
      if (upCache && upCache.key === todayKey) return upCache.list;
      const list = [], seen = new Set(), base = new Date(); base.setHours(0,0,0,0);
      for (let i = 0; i <= 380; i++) {
        const dt = new Date(base.getTime() + i * 86400000);
        const p = getDayPanchang(dt.getFullYear(), dt.getMonth(), dt.getDate(), false);
        p.keys.forEach(k => {
          const id = k + (isMajor(k) ? "" : `@${i}`);
          if (seen.has(id)) return;
          seen.add(id);
          list.push({ key: k, date: dt, days: i, p, kind: isEkaKey(k) ? "eka" : "fest" });
        });
      }
      upCache = { key: todayKey, list };
      return list;
    }

    function renderMoonSVG(diff) {
      const r = 18, cx = 22, cy = 22;
      const rad = toRad(diff);
      const rx = Math.abs(Math.cos(rad)) * r;
      const waxing = diff <= 180;
      let litPath = "";
      if (diff < 3 || diff > 357) {
        litPath = "";
      } else if (Math.abs(diff - 180) < 3) {
        litPath = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#F5E6B3"/>`;
      } else if (waxing) {
        const sweepInner = diff < 90 ? 0 : 1;
        litPath = `<path d="M ${cx} ${cy - r} A ${r} ${r} 0 0 1 ${cx} ${cy + r} A ${rx.toFixed(2)} ${r} 0 0 ${sweepInner} ${cx} ${cy - r} Z" fill="#F5E6B3"/>`;
      } else {
        const sweepInner = diff < 270 ? 1 : 0;
        litPath = `<path d="M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} A ${rx.toFixed(2)} ${r} 0 0 ${sweepInner} ${cx} ${cy - r} Z" fill="#F5E6B3"/>`;
      }
      return `<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="#23252C" stroke="var(--border)" stroke-width="1.2"/>
        ${litPath}
      </svg>`;
    }

        : (lang === "hi" ? "पितृपक्ष, भद्रा एवं अशुभ वार से मुक्त।" : "Free from Pitru Paksha, Bhadra, and inauspicious weekdays.");

        : `<b>Why auspicious for ${cat}:</b><br>• <b>${nak}</b> Nakshatra is favourable for this ceremony in Mithila tradition.<br>• <b>${tithi}</b> (non-Rikta) on <b>${vaar}</b> is auspicious.<br>• ${extra}${cb}${cau}<br>• Best window (${L.abhijit}): <b>${win}</b>`;

    function renderMuhurat(type = currentMuhurat) {
      currentMuhurat = type;
      const L = I18N[lang], rule = MUHURAT_RULES[type];
      document.getElementById("muhuratChips").innerHTML = Object.keys(L.muhuratCats).map(k =>

      ).join("");
      document.getElementById("selRashi").innerHTML = `<option value="-1" ${myRashi<0?'selected':''}>${L.rashiNone}</option>` +
        RASHIS[lang].map((r, i) => `<option value="${i}" ${i===myRashi?'selected':''}>${L.myRashi.split(" (")[0]}: ${r}</option>`).join("");

      const base = new Date(); base.setHours(0,0,0,0);
      const results = [];
      for (let i = 0; i <= 90 && results.length < 10; i++) {
        const dt = new Date(base.getTime() + i * 86400000);
        const p = getDayPanchang(dt.getFullYear(), dt.getMonth(), dt.getDate(), false), n = p.noon;
        if (p.isAdhika) continue;
        const t15 = n.tithiIdx % 15;
        if ([3, 8, 13].includes(t15) || n.tithiIdx === 29 || rule.badDow.includes(p.dow)) continue;
        if (!rule.naks.includes(n.nakIdx)) continue;
        if (n.karanaKey === "Vishti") continue;
        if (n.amantaIdx === 5 && n.tithiIdx >= 15) continue;
        if (rule.noPanchak && [22,23,24,25,26].includes(n.nakIdx)) continue;
        if (rule.noGand && [0,8,9,17,18,26].includes(n.nakIdx)) continue;
        if (rule.strict) {
          if (n.sunRashiIdx === 8 || n.sunRashiIdx === 11) continue;
          const ai = n.amantaIdx, ti = n.tithiIdx;
          const isChat = (ai === 3 && ti >= 10) || ai === 4 || ai === 5 || ai === 6 || (ai === 7 && ti < 10);
          if (isChat) continue;
          const sun = getSunLon(n.dt), ven = getPlanetLon("Venus", n.dt), jup = getPlanetLon("Jupiter", n.dt);
          if (Math.min(norm(ven - sun), norm(sun - ven)) < 9 || Math.min(norm(jup - sun), norm(sun - jup)) < 11) continue;
        }
        const cb = myRashi >= 0 ? CHANDRA_OK.includes((n.moonRashiIdx - myRashi + 12) % 12) : null;
        if (cb === false) continue;
        const cautions = [];
        if ([22,23,24,25,26].includes(n.nakIdx)) cautions.push(L.panchakCaution);
        if ([0,8,9,17,18,26].includes(n.nakIdx)) cautions.push(L.gandCaution);
        results.push({ dt, days: i, p, n, cb, cautions });
      }

      document.getElementById("muhuratList").innerHTML = results.length ? results.map((r, idx) => `
        <div class="exp-wrap" id="m-exp-${idx}">
          <div class="exp-head" role="button" onclick="document.getElementById('m-exp-${idx}').classList.toggle('open')">
            <div>
              <div class="li-name">${fmtShortDate(r.dt)}</div>
              <div class="li-sub">${masaLabel(r.p)} ${L[r.n.pakshaKey]} ${TITHIS[lang][r.n.tithiIdx]} • ${NAKSHATRAS[lang][r.n.nakIdx]} ${r.cautions.length ? `<span class="warn-tag">${r.cautions[0]}</span>` : ""}</div>
            </div>
            <div class="li-badge">${fmtDays(r.days)} ▾</div>
          </div>
          <div class="exp-body">
            ${getMuhuratReason(type, r)}
            <div style="margin-top:6px;">
              <span class="mini-link" role="button" onclick="jumpToDate(${r.dt.getFullYear()},${r.dt.getMonth()},${r.dt.getDate()})">${L.viewInCal} →</span>
              <span class="mini-link" role="button" onclick="downloadICS([{date:new Date(${r.dt.getTime()}),title:'${L.muhuratCats[type]} Muhurat',desc:'${NAKSHATRAS[lang][r.n.nakIdx]}'}],'muhurat.ics')">${L.addCal}</span>

    function renderTransitsAndEclipses() {
      const L = I18N[lang], base = new Date(); base.setHours(12,0,0,0);
      const tracked = ["Sun","Mars","Mercury","Venus","Jupiter","Saturn"], startMap = {}, found = [];
      tracked.forEach(n => startMap[n] = Math.floor(norm(getPlanetLon(n, base) - getAyanamsa(base)) / 30));
      for (let i = 1; i <= 180 && found.length < 6; i++) {
        const dt = new Date(base.getTime() + i * 86400000), ayan = getAyanamsa(dt);
        for (const n of tracked) {
          const r = Math.floor(norm(getPlanetLon(n, dt) - ayan) / 30);
          if (r !== startMap[n]) { found.push({ n, r, dt, days: i }); startMap[n] = r; }
        }
      }
      document.getElementById("transitList").innerHTML = found.map(t => `
        <div class="list-item">
          <div><div class="li-name">${lang==="hi"?PLANET_HI[t.n]:t.n} ${L.enters} ${RASHIS[lang][t.r]}</div><div class="li-sub">${fmtShortDate(t.dt)}</div></div>
          <div class="li-badge">${fmtDays(t.days)}</div>

      const ecl = [];

        ecl.sort((a, b) => a.dt - b.dt);
      }
      document.getElementById("eclipseList").innerHTML = ecl.length ? ecl.slice(0, 6).map(e => `
        <div class="list-item">
          <div><div class="li-name" style="text-transform:capitalize;">${e.kind}</div><div class="li-sub">${fmtShortDate(e.dt)} • Peak ${fmtTime(e.dt)}<br><b>${L.sutak}:</b> ${e.sutak}</div></div>

      document.getElementById("festList").innerHTML = list.length ? list.map(f => `
        <div class="list-item" role="button" style="cursor:pointer;" onclick="jumpToDate(${f.date.getFullYear()},${f.date.getMonth()},${f.date.getDate()})">
          <div><div class="li-name">${festName(f.key)}</div><div class="li-sub">${fmtShortDate(f.date)} • ${masaLabel(f.p)} ${L[f.p.pakshaKey]} ${TITHIS[lang][f.p.tithiAM]}</div></div>
          <div class="li-badge">${fmtDays(f.days)}</div>
        </div>`).join("") : `<div class="note">${L.noMatch}</div>`;
    }
    function quickTithi(idx) { activeQuickIdx = idx; finderPaksha = QUICK_PRESETS[idx][0]; finderTithi = QUICK_PRESETS[idx][1]; renderCountdowns(); }
    function updateTithiFinder(fromRender) {
      if (!fromRender) {
        finderPaksha = document.getElementById("selPaksha").value;
        finderTithi = parseInt(document.getElementById("selTithi").value, 10);
        activeQuickIdx = -1;
        document.querySelectorAll("#quickChips .chip").forEach(c => c.classList.remove("active"));
      }
      const base = new Date(); base.setHours(0,0,0,0);
      let res = null;
      for (let i = 0; i <= 60; i++) {
        const dt = new Date(base.getTime() + i * 86400000);
        const p = getDayPanchang(dt.getFullYear(), dt.getMonth(), dt.getDate(), false);
        if ((p.tithiAM % 15) === finderTithi && (finderPaksha === "Any" || p.pakshaKey === finderPaksha)) {
          res = { dt, days: i, p: getDayPanchang(dt.getFullYear(), dt.getMonth(), dt.getDate(), true) };
          break;
        }
      }
      const L = I18N[lang];
      if (!res) { document.getElementById("finderResult").innerHTML = `<div class="note">${L.noMatch}</div>`; return; }
      document.getElementById("finderResult").innerHTML = `
        <div>
          <div class="fest-name" style="font-size:15px;">${L[res.p.pakshaKey]} ${TITHIS[lang][res.p.tithiAM]}</div>
          <div class="fest-date">${fmtShortDate(res.dt)} • ${masaLabel(res.p)}</div>
          <div class="fest-date" style="color:var(--mint);margin-top:3px;">${fmtDT(res.p.tithiStart)} → ${fmtDT(res.p.tithiEnd)}</div>
        </div>
        <div class="days-badge"><div class="num">${res.days === 0 ? "★" : res.days}</div><div class="lbl">${res.days === 0 ? L.today : (res.days === 1 ? L.day : L.days)}</div></div>`;
    }

    /* ======================= Puja Tab (with Share on Vidhi) ======================= */
    function switchPujaMode(mode) {
      pujaMode = mode;
      document.getElementById("seg-mantra").classList.toggle("active", mode === "mantra");
      document.getElementById("seg-vidhi").classList.toggle("active", mode === "vidhi");
      renderPujaTab();
    }
    function renderPujaTab() {
      const box = document.getElementById("pujaContent"), L = I18N[lang];
      if (pujaMode === "mantra") {
        box.innerHTML = SANSKRIT_MANTRAS.map(m => `<div class="mantra-card" lang="sa"><div class="mantra-title">${m.title}</div><div class="mantra-text">${m.text}</div></div>`).join("");
      } else {
        box.innerHTML = `<div class="card">` + MAITHIL_VIDHIS.map((v, idx) => `
          <div class="exp-wrap ${idx===0?'open':''}" id="v-exp-${idx}" lang="${lang}">
            <div class="exp-head" role="button" onclick="document.getElementById('v-exp-${idx}').classList.toggle('open')">
              <div><div class="li-name">${lang==="hi"?v.hiTitle:v.enTitle}</div><div class="li-sub">${lang==="hi"?v.hiSub:v.enSub}</div></div>
              <div class="li-badge">▾</div>
            </div>
            <div class="exp-body">
              <ol class="vidhi-steps">${(lang==="hi"?v.hiSteps:v.enSteps).map(s => `<li>${s}</li>`).join("")}</ol>
              <span class="mini-link" role="button" onclick="shareVidhi(${idx})">${L.share}</span>
            </div>
          </div>`).join("") + `</div>`;
      }
    }

    /* ======================= Navigation, Swipe, Jump, Theme, Font, Lifecycle ======================= */
    function switchTab(name) {
      currentTab = name;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById(`view-${name}`).classList.add("active");
      document.getElementById(`tab-${name}`).classList.add("active");
      document.getElementById("topTitle").innerText = I18N[lang].titles[name];
      renderActiveView();
      window.scrollTo(0, 0);
    }

    function renderActiveView() {
      applyStaticLabels();
      renderHeader();
      if (currentTab === "calendar") { renderCalendar(); setTimeout(renderBanner, 0); }
      else if (currentTab === "panchang" && !renderedTabs.has("panchang")) { renderPanchangTab(); renderedTabs.add("panchang"); }
      else if (currentTab === "muhurat" && !renderedTabs.has("muhurat")) { renderMuhurat(currentMuhurat); renderedTabs.add("muhurat"); }
      else if (currentTab === "astro" && !renderedTabs.has("astro")) { renderPlanets(); renderTransitsAndEclipses(); renderedTabs.add("astro"); }
      else if (currentTab === "countdown" && !renderedTabs.has("countdown")) { renderCountdowns(); renderedTabs.add("countdown"); }
      else if (currentTab === "puja" && !renderedTabs.has("puja")) { renderPujaTab(); renderedTabs.add("puja"); }
    }

    function toggleLang() { lang = lang === "en" ? "hi" : "en"; sSet("mc_lang", lang); renderedTabs.clear(); renderActiveView(); }
    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark"; sSet("mc_theme", theme);
      document.body.classList.toggle("light", theme === "light");
      document.getElementById("themeBtn").innerText = theme === "light" ? "🌙" : "☀️";
      document.getElementById("metaTheme").content = theme === "light" ? "#E8ECF2" : "#0A0B0E";
    }
    function toggleLargeFont() {
      largeFont = !largeFont; sSet("mc_large", largeFont ? "1" : "0");
      document.body.classList.toggle("large-font", largeFont);
      document.getElementById("fontBtn").classList.toggle("active", largeFont);
    }
    function selectDay(y, m, d) { selectedDate = new Date(y, m, d); renderCalendar(); }
    function changeMonth(delta) { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1); renderCalendar(); }
    function goToday() { viewDate = new Date(); selectedDate = new Date(); renderCalendar(); switchTab("calendar"); }
    function jumpToDate(y, m, d) { viewDate = new Date(y, m, 1); selectedDate = new Date(y, m, d); renderCalendar(); switchTab("calendar"); }

    function toggleJumpBar() {
      const bar = document.getElementById("jumpBar");
      bar.classList.toggle("open");
      if (bar.classList.contains("open")) {
        document.getElementById("jumpMonth").innerHTML = I18N[lang].gMonths.map((m, i) => `<option value="${i}" ${i===viewDate.getMonth()?'selected':''}>${m}</option>`).join("");
        let yrs = ""; for (let y = 2020; y <= 2035; y++) yrs += `<option value="${y}" ${y===viewDate.getFullYear()?'selected':''}>${y}</option>`;
        document.getElementById("jumpYear").innerHTML = yrs;
      }
    }
    function applyJump() {
      viewDate = new Date(parseInt(document.getElementById("jumpYear").value, 10), parseInt(document.getElementById("jumpMonth").value, 10), 1);
      renderCalendar();
    }

    // Hide Date Selector when clicking anywhere outside it
    document.addEventListener("click", e => {
      const bar = document.getElementById("jumpBar");
      if (!bar.classList.contains("open")) return;
      if (!bar.contains(e.target) && !document.getElementById("monthMetaBtn").contains(e.target)) {
        bar.classList.remove("open");
      }
    });

    // Swipe Left/Right on Calendar
    let touchX = 0, touchY = 0;
    const calArea = document.getElementById("calSwipeArea");
    calArea.addEventListener("touchstart", e => { touchX = e.changedTouches[0].screenX; touchY = e.changedTouches[0].screenY; }, { passive: true });
    calArea.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].screenX - touchX, dy = e.changedTouches[0].screenY - touchY;
      if (Math.abs(dx) > 55 && Math.abs(dy) < 45) changeMonth(dx < 0 ? 1 : -1);
    }, { passive: true });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderedTabs.clear(); renderActiveView(); } });
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }

    // Boot
    if (theme === "light") {
      document.body.classList.add("light");
      document.getElementById("themeBtn").innerText = "🌙";
      document.getElementById("metaTheme").content = "#E8ECF2";
    }
    if (largeFont) {
      document.body.classList.add("large-font");
      document.getElementById("fontBtn").classList.add("active");
    }
    const bootNow = new Date();
    document.getElementById("astroDate").value = localISO(bootNow);
    document.getElementById("astroTime").value = localTimeISO(bootNow);
    renderActiveView();
    initAutoLocation();
  </script>
</body>
</html>
