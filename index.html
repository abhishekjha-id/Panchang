<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mithila Cal">
  <meta name="theme-color" content="#121214" id="metaTheme">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.PNG?v=6">
  <link rel="icon" type="image/png" href="icon.PNG?v=6">
  <title>Mithila Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
    :root {
      --bg: #121214; --card: #1C1C1F; --elevated: #25252A; --border: #323238;
      --text: #F5F5FA; --muted: #A9A9B3;
      --mint: #4AE3B5; --mint-dim: rgba(74, 227, 181, 0.14); --mint-border: rgba(74, 227, 181, 0.42);
      --gold: #F5B942; --gold-dim: rgba(245, 185, 66, 0.14); --gold-border: rgba(245, 185, 66, 0.42);
      --fest: #FF7A90; --fest-dim: rgba(255, 122, 144, 0.14); --fest-border: rgba(255, 122, 144, 0.42);
      --krishna: #8696E8;
      --warn: #FF6B6B; --warn-dim: rgba(255, 107, 107, 0.14);
      --tab-bg: rgba(24, 24, 27, 0.95);
      --scale: 1;
    }
    body.light {
      --bg: #F4F5F7; --card: #FFFFFF; --elevated: #ECEEF2; --border: #D5D9E2;
      --text: #121417; --muted: #505664;
      --mint: #0C7C5C; --mint-dim: rgba(12, 124, 92, 0.11); --mint-border: rgba(12, 124, 92, 0.35);
      --gold: #A66800; --gold-dim: rgba(166, 104, 0, 0.11); --gold-border: rgba(166, 104, 0, 0.35);
      --fest: #C42B4B; --fest-dim: rgba(196, 43, 75, 0.11); --fest-border: rgba(196, 43, 75, 0.35);
      --krishna: #4558B8;
      --warn: #C42828; --warn-dim: rgba(196, 40, 40, 0.10);
      --tab-bg: rgba(255, 255, 255, 0.96);
    }
    body.large-text { --scale: 1.18; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--bg); color: var(--text); margin: 0; min-height: 100vh;
      font-size: calc(14px * var(--scale));
      padding: calc(env(safe-area-inset-top) + 22px) 14px calc(env(safe-area-inset-bottom) + 88px) 14px;
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; right: 0;
      height: calc(env(safe-area-inset-top) + 8px);
      background: linear-gradient(180deg, var(--bg) 75%, transparent 100%);
      z-index: 90; pointer-events: none;
    }

    .topbar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
      padding: 10px 12px; gap: 6px; border: 1px solid var(--border); border-radius: 16px;
      background: radial-gradient(circle at 12% 50%, var(--mint-dim), var(--card) 65%);
    }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .brand-icon { width: 32px; height: 32px; flex-shrink: 0; }
    .app-title { font-size: calc(16px * var(--scale)); font-weight: 700; letter-spacing: -0.2px; }
    .app-sub { font-size: calc(10.5px * var(--scale)); color: var(--mint); font-weight: 600; margin-top: 2px; }
    .top-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .icon-btn, .pill-btn {
      background: var(--elevated); color: var(--mint); border: 1px solid var(--border);
      border-radius: 18px; min-height: 36px; padding: 0 9px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .icon-btn.active { background: var(--mint); color: #0D1613; border-color: var(--mint); }
    .pill-btn.dim { opacity: 0.42; }

    .loc-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .loc-bar select { padding: 8px 10px; font-size: calc(12.5px * var(--scale)); min-height: 40px; }
    .gps-btn {
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; min-height: 40px;
    }

    .view { display: none; animation: fadeIn 0.14s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }

    .seg-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 12px;
    }
    .seg-btn { padding: 9px; text-align: center; font-size: calc(12.5px * var(--scale)); font-weight: 700; border-radius: 9px; color: var(--muted); cursor: pointer; }
    .seg-btn.active { background: var(--mint); color: #0D1613; }

    .fest-banner {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: linear-gradient(135deg, var(--mint-dim) 0%, var(--card) 100%);
      border: 1px solid var(--mint-border); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 12px; cursor: pointer;
    }
    .fest-kicker { font-size: calc(10.5px * var(--scale)); font-weight: 700; color: var(--mint); letter-spacing: 0.5px; text-transform: uppercase; }
    .fest-name { font-size: calc(15.5px * var(--scale)); font-weight: 700; margin: 2px 0; }
    .fest-date { font-size: calc(12px * var(--scale)); color: var(--muted); }
    .days-badge {
      background: var(--mint); color: #0D1613; border-radius: 12px;
      padding: 8px 12px; text-align: center; min-width: 68px; flex-shrink: 0;
    }
    .days-badge .num { font-size: calc(18px * var(--scale)); font-weight: 800; line-height: 1; }
    .days-badge .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

    /* Calendar */
    .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
    .nav-btn {
      background: var(--elevated); color: var(--mint); border: 1px solid var(--border);
      border-radius: 10px; width: 44px; height: 44px; font-size: 20px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .month-meta { text-align: center; cursor: pointer; padding: 4px 8px; border-radius: 10px; }
    .month-title { font-size: calc(15px * var(--scale)); font-weight: 700; text-transform: uppercase; }
    .month-hindu { font-size: calc(11.5px * var(--scale)); color: var(--muted); margin-top: 2px; }
    .jump-bar { display: none; gap: 6px; margin-bottom: 10px; }
    .jump-bar.open { display: flex; }

    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .dow { font-size: calc(11px * var(--scale)); font-weight: 700; color: var(--muted); padding: 4px 0; }
    .dow.wknd { color: var(--mint); }
    .day {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 5px 2px; cursor: pointer; min-width: 0; min-height: 54px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      border-top: 3px solid var(--mint); overflow: hidden;
    }
    .day.krishna { border-top-color: var(--krishna); }
    .day.wknd-cell { background: rgba(128, 128, 140, 0.06); }
    .day.ekadashi { background: var(--gold-dim); border-color: var(--gold-border); }
    .day.purnima, .day.amavasya { background: var(--mint-dim); border-color: var(--mint-border); }
    .day.festival { background: var(--fest-dim); border-color: var(--fest-border); }
    .day.today { box-shadow: 0 0 0 1.5px var(--mint) inset; }
    .day.selected { background: var(--mint); color: #0D1613; border-color: var(--mint); }
    .day .num { font-size: calc(14px * var(--scale)); font-weight: 700; line-height: 1.1; }
    .day .t { font-size: calc(9.5px * var(--scale)); font-weight: 600; opacity: 0.92; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .day.compact { min-height: 44px; justify-content: center; gap: 3px; }
    .day.compact .t { display: none; }
    .day .marker { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
    .day.festival .marker { background: var(--fest); }
    .day.ekadashi .marker { background: var(--gold); }
    .day.purnima .marker, .day.amavasya .marker { background: var(--mint); }
    .day.selected .marker { background: #0D1613; }

    .legend {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: calc(11px * var(--scale)); color: var(--muted);
    }
    .leg-items { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .leg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .compact-btn {
      background: var(--elevated); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 9px; font-size: 11px; font-weight: 600; cursor: pointer;
    }

    /* Details */
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .card-head h3 { margin: 0; font-size: calc(15px * var(--scale)); color: var(--mint); }
    .fest-tag {
      background: var(--fest-dim); color: var(--fest); border: 1px solid var(--fest-border);
      font-size: calc(11px * var(--scale)); font-weight: 700; padding: 3px 8px; border-radius: 12px;
    }
    .warn-tag {
      background: var(--warn-dim); color: var(--warn); border: 1px solid rgba(255,107,107,0.35);
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap;
    }
    .row {
      font-size: calc(13.5px * var(--scale)); display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border); gap: 10px;
    }
    .row:last-child { border-bottom: none; padding-bottom: 0; }
    .lbl { color: var(--muted); }
    .val { font-weight: 500; text-align: right; }
    .val.mint { color: var(--mint); font-weight: 600; }
    .val.warn { color: var(--warn); font-weight: 600; }

    .why-box {
      margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      background: var(--bg); border-left: 3px solid var(--mint);
    }
    .why-title { font-size: calc(11px * var(--scale)); font-weight: 700; color: var(--mint); text-transform: uppercase; margin-bottom: 4px; }
    .why-text { font-size: calc(12.5px * var(--scale)); line-height: 1.5; }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .mini-link {
      display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 10px;
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      font-size: calc(12px * var(--scale)); font-weight: 700; cursor: pointer;
    }

    .hero { display: flex; align-items: center; gap: 14px; }
    .moon-box {
      width: 56px; height: 56px; border-radius: 14px; background: var(--bg);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hero-tithi { font-size: calc(19px * var(--scale)); font-weight: 700; }
    .hero-sub { font-size: calc(12.5px * var(--scale)); color: var(--mint); font-weight: 600; margin-top: 2px; }
    .hero-year { font-size: calc(11.5px * var(--scale)); color: var(--muted); margin-top: 3px; }

    .mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .mini-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .mini-lbl { font-size: calc(11px * var(--scale)); font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .mini-val { font-size: calc(14px * var(--scale)); font-weight: 600; margin-top: 4px; }
    .mini-val.mint { color: var(--mint); }
    .mini-val.warn { color: var(--warn); }

    .sec-title { font-size: calc(11.5px * var(--scale)); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 4px 0 8px 2px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip {
      background: var(--elevated); border: 1px solid var(--border); color: var(--text);
      font-size: calc(12px * var(--scale)); font-weight: 600; padding: 8px 12px; border-radius: 18px; cursor: pointer;
    }
    .chip.active { background: var(--mint-dim); border-color: var(--mint); color: var(--mint); }
    .select-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-bottom: 12px; }
    .date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    select, input[type="date"], input[type="search"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: calc(13.5px * var(--scale)); font-weight: 600; width: 100%; outline: none;
    }
    .reset-btn {
      background: var(--elevated); color: var(--mint); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .finder-result {
      background: var(--bg); border: 1px solid var(--mint-border); border-radius: 12px;
      padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; min-height: 44px;
    }
    .list-item:last-child { border-bottom: none; padding-bottom: 0; }
    .li-name { font-size: calc(14px * var(--scale)); font-weight: 600; }
    .li-sub { font-size: calc(12px * var(--scale)); color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .li-badge {
      background: var(--mint-dim); color: var(--mint); border: 1px solid var(--mint-border);
      border-radius: 10px; padding: 5px 9px; font-size: calc(11.5px * var(--scale)); font-weight: 700; white-space: nowrap;
    }

    .exp-wrap { border-bottom: 1px solid var(--border); padding: 10px 0; }
    .exp-wrap:last-child { border-bottom: none; padding-bottom: 0; }
    .exp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; min-height: 44px; }
    .exp-body {
      display: none; margin-top: 8px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border-left: 3px solid var(--mint); font-size: calc(13px * var(--scale)); line-height: 1.55;
    }
    .exp-wrap.open .exp-body { display: block; }

    .mantra-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px;
      user-select: text; -webkit-user-select: text;
    }
    .mantra-title { font-size: calc(14.5px * var(--scale)); font-weight: 700; color: var(--mint); margin-bottom: 6px; }
    .mantra-text { font-size: calc(15.5px * var(--scale)); line-height: 1.8; color: var(--text); white-space: pre-line; }
    .vidhi-steps { margin: 6px 0 0 18px; padding: 0; }
    .vidhi-steps li { margin-bottom: 6px; }
    .note { font-size: calc(11.5px * var(--scale)); color: var(--muted); line-height: 1.45; margin-top: 8px; }

    /* 5 Spacious Bottom Tabs */
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--tab-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px) 4px; z-index: 100;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; min-height: 46px;
    }
    .tab svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .tab.active { color: var(--mint); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="29" stroke="#4AE3B5" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="3 3"/>
        <circle cx="32" cy="32" r="22" stroke="#4AE3B5" stroke-opacity="0.45" stroke-width="1"/>
        <path d="M32 6L35 16L44 10L41 20L52 19L45 27L56 32L45 37L52 45L41 44L44 54L35 48L32 58L29 48L20 54L23 44L12 45L19 37L8 32L19 27L12 19L23 20L20 10L29 16Z" fill="#4AE3B5" fill-opacity="0.22" stroke="#4AE3B5" stroke-width="1.3"/>
        <circle cx="32" cy="32" r="10.5" fill="#4AE3B5"/>
      </svg>
      <div>
        <div class="app-title" id="topTitle">Mithila Calendar</div>
        <div class="app-sub" id="topSub"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="textBtn" onclick="toggleTextSize()" aria-label="Large text">A+</button>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
      <button class="icon-btn" id="langBtn" onclick="toggleLang()">हिं</button>
      <button class="pill-btn" id="todayBtn" onclick="goToday()">Today</button>
    </div>
  </div>

  <!-- Location Picker -->
  <div class="loc-bar">
    <select id="citySelect" onchange="selectCity(this.value)" aria-label="Select Location"></select>
    <button class="gps-btn" id="gpsBtn" onclick="requestGPS()">Use GPS</button>
  </div>

  <!-- TAB 1: CALENDAR + EVENTS SWITCHER -->
  <div id="view-calendar" class="view active">
    <div class="seg-bar">
      <div class="seg-btn active" id="seg-cal" role="button" onclick="switchCalMode('cal')">Calendar</div>
      <div class="seg-btn" id="seg-events" role="button" onclick="switchCalMode('events')">Festivals & Tithi</div>
    </div>

    <div id="cal-panel">
      <div class="fest-banner" id="nextFestBanner" role="button" tabindex="0" onclick="switchCalMode('events')"></div>
      <div class="card" id="calSwipeArea">
        <div class="cal-nav">
          <button class="nav-btn" onclick="changeMonth(-1)" aria-label="Previous Month">‹</button>
          <div class="month-meta" role="button" tabindex="0" onclick="toggleJumpBar()">
            <div class="month-title" id="monthTitle"></div>
            <div class="month-hindu" id="monthHindu"></div>
          </div>
          <button class="nav-btn" onclick="changeMonth(1)" aria-label="Next Month">›</button>
        </div>
        <div class="jump-bar" id="jumpBar">
          <select id="jumpMonth" onchange="applyJump()"></select>
          <select id="jumpYear" onchange="applyJump()"></select>
        </div>
        <div class="grid" id="calGrid"></div>
        <div class="legend">
          <div class="leg-items" id="calLegend"></div>
          <button class="compact-btn" id="compactBtn" onclick="toggleCompact()">Compact</button>
        </div>
      </div>
      <div class="card" id="detailCard"></div>
      <div class="sec-title" id="secMonthFests"></div>
      <div class="card" id="monthFestList"></div>
    </div>

    <div id="events-panel" style="display:none;">
      <div class="sec-title" id="secTithiFinder"></div>
      <div class="card">
        <div class="chips" id="quickChips"></div>
        <div class="select-row">
          <select id="selPaksha" onchange="updateTithiFinder()"></select>
          <select id="selTithi" onchange="updateTithiFinder()"></select>
        </div>
        <div class="finder-result" id="finderResult"></div>
      </div>
      <div class="sec-title" id="secFestList"></div>
      <div class="card" id="festList"></div>
    </div>
  </div>

  <!-- TAB 2: PANCHANG -->
  <div id="view-panchang" class="view">
    <div class="card" id="panchangHero"></div>
    <div class="mini-grid" id="panchangGrid"></div>
    <div class="card" id="panchangTimings"></div>
    <div class="card" id="panchangKaal"></div>
    <div class="card" id="panchangExtra"></div>
  </div>

  <!-- TAB 3: MAITHIL MUHURAT -->
  <div id="view-muhurat" class="view">
    <div class="sec-title" id="secMuhurat"></div>
    <div class="card">
      <div class="chips" id="muhuratChips"></div>
      <div id="muhuratList"></div>
      <div class="note" id="muhuratNote"></div>
    </div>
  </div>

  <!-- TAB 4: ASTRONOMY -->
  <div id="view-astro" class="view">
    <div class="sec-title" id="secPlanets"></div>
    <div class="card">
      <div class="date-row">
        <input type="date" id="astroDate" onchange="renderPlanets()">
        <button class="reset-btn" id="astroResetBtn" onclick="resetAstroDate()">Reset</button>
      </div>
      <div class="mini-grid" id="astroSummary" style="margin-bottom:10px;"></div>
      <div id="planetList"></div>
    </div>
    <div class="sec-title" id="secTransits"></div>
    <div class="card" id="transitList"></div>
    <div class="sec-title" id="secEclipses"></div>
    <div class="card" id="eclipseList"></div>
  </div>

  <!-- TAB 5: PUJA -->
  <div id="view-puja" class="view">
    <div class="seg-bar">
      <div class="seg-btn active" id="seg-mantra" role="button" onclick="switchPujaMode('mantra')">मन्त्राः (Sanskrit)</div>

    function getDayExplainer(p) {

      if (p.tithiAM === 10 || p.tithiAM === 25) return lang === "hi"
        ? "एकादशी भगवान विष्णु को समर्पित है; मानसिक शुद्धि व आध्यात्मिक अनुशासन हेतु उपवास रखा जाता है।"
        : "Ekadashi is dedicated to Lord Vishnu; traditionally observed with fasting for spiritual clarity.";
      if (p.tithiAM === 14) return lang === "hi"
        ? "पूर्णिमा (पूर्ण चंद्र) सत्यनारायण कथा, ध्यान और दान-पुण्य के लिए अत्यंत शुभ मानी जाती है।"
        : "Purnima (Full Moon) amplifies lunar energy; auspicious for Satyanarayan Puja, meditation, and charity.";
      if (p.tithiAM === 29) return lang === "hi"
        ? "अमावस्या पितृ तर्पण, पूर्वजों के स्मरण और शांत आत्मचिंतन के लिए समर्पित होती है।"
        : "Amavasya (New Moon) is dedicated to honoring ancestors (Pitru Tarpan) and quiet introspection.";
      if (p.tithiAM === 12 || p.tithiAM === 27) return lang === "hi"
        ? "प्रदोष व्रत (त्रयोदशी) भगवान शिव को समर्पित है, विशेषकर सूर्यास्त के बाद प्रदोष काल में।"
        : "Pradosh Vrat (Trayodashi) is dedicated to Lord Shiva, especially observed during twilight after sunset.";
      return lang === "hi"
        ? `${MASAS.hi[p.masaIdx]} मास के ${I18N.hi[p.pakshaKey]} पक्ष की ${TITHIS.hi[p.tithiIdx]} एवं ${NAKSHATRAS.hi[p.nakIdx]} नक्षत्र—दैनिक पूजा व नियमित कार्यों के लिए उपयुक्त।`
        : `${I18N.en[p.pakshaKey]} ${TITHIS.en[p.tithiIdx]} in ${MASAS.en[p.masaIdx]} Masa under ${NAKSHATRAS.en[p.nakIdx]} Nakshatra—suitable for routine spiritual practice and daily duties.`;
    }

    // --- Precision Astronomy Wrapper (City Timezone Aware) ---
    const HAS_ASTRO = typeof Astronomy !== "undefined";
    function norm(d) { return ((d % 360) + 360) % 360; }
    function cityTimeDate(y, m, d, h, min = 0) { return new Date(Date.UTC(y, m, d, h, min, 0) - OFFSET * 60000); }
    function getAyanamsa(date) { return 23.853 + 0.013969 * ((date.getFullYear() + date.getMonth() / 12) - 2000); }

    function getSunLon(date) {
      if (HAS_ASTRO) return norm(Astronomy.SunPosition(date).elon);
      const jd = (date.getTime() / 86400000) + 2440587.5, n = jd - 2451545.0;
      const L = norm(280.46 + 0.9856474 * n), g = norm(357.528 + 0.9856003 * n) * Math.PI / 180;
      return norm(L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g));
    }
    function getMoonLon(date) {
      if (HAS_ASTRO) return norm(Astronomy.EclipticGeoMoon(date).lon);
      const jd = (date.getTime() / 86400000) + 2440587.5, d = jd - 2451543.5;
      const M = norm(115.3654 + 13.06499295 * d) * Math.PI / 180;
      return norm(218.316 + 13.176396 * d + 6.289 * Math.sin(M));
    }
    function getPlanetLon(name, date) {
      if (name === "Sun") return getSunLon(date);
      if (name === "Moon") return getMoonLon(date);
      const jd = (date.getTime() / 86400000) + 2440587.5, d = jd - 2451545.0;
      if (name === "Rahu") return norm(125.0445 - 0.05295377 * d);
      if (name === "Ketu") return norm(125.0445 - 0.05295377 * d + 180);
      if (HAS_ASTRO) return norm(Astronomy.Ecliptic(Astronomy.GeoVector(name, date, true)).elon);
      return 0;
    }

    function findPhaseTime(refDate, targetDeg) {
      if (HAS_ASTRO) {
        const t = Astronomy.SearchMoonPhase(targetDeg, new Date(refDate.getTime() - 28 * 3600000), 3);
        if (t) return t.date;
      }
      let ms = refDate.getTime();
      for (let i = 0; i < 8; i++) {
        const dt = new Date(ms), diff = norm(getMoonLon(dt) - getSunLon(dt));
        ms += ((((targetDeg - diff + 540) % 360) - 180) / 12.19075) * 86400000;
      }
      return new Date(ms);
    }

    function getRiseSet(y, m, d, dow) {
      const base = cityTimeDate(y, m, d, 0, 0);
      let sr = null, ss = null, mr = null, ms = null;
      if (HAS_ASTRO) {
        const obs = new Astronomy.Observer(LAT, LON, 0);
        const r1 = Astronomy.SearchRiseSet("Sun", obs, +1, base, 1);
        const s1 = Astronomy.SearchRiseSet("Sun", obs, -1, base, 1);
        const r2 = Astronomy.SearchRiseSet("Moon", obs, +1, base, 1);
        const s2 = Astronomy.SearchRiseSet("Moon", obs, -1, base, 1);
        if (r1) sr = r1.date; if (s1) ss = s1.date; if (r2) mr = r2.date; if (s2) ms = s2.date;
      }
      if (!sr) sr = cityTimeDate(y, m, d, 6, 0);
      if (!ss) ss = cityTimeDate(y, m, d, 18, 0);
      const seg = (ss - sr) / 8, mid = new Date((sr.getTime() + ss.getTime()) / 2);
      const rahuSeg = [7,1,6,4,5,3,2][dow], yamaSeg = [4,3,2,1,0,6,5][dow], gulikaSeg = [6,5,4,3,2,1,0][dow];
      return {
        sunrise: sr, sunset: ss, moonrise: mr, moonset: ms,
        brahmaStart: new Date(sr.getTime() - 96 * 60000), brahmaEnd: new Date(sr.getTime() - 48 * 60000),
        pradoshStart: ss, pradoshEnd: new Date(ss.getTime() + 144 * 60000),
        abhijitStart: new Date(mid.getTime() - 24 * 60000), abhijitEnd: new Date(mid.getTime() + 24 * 60000),
        rahuStart: new Date(sr.getTime() + rahuSeg * seg), rahuEnd: new Date(sr.getTime() + (rahuSeg + 1) * seg),
        yamaStart: new Date(sr.getTime() + yamaSeg * seg), yamaEnd: new Date(sr.getTime() + (yamaSeg + 1) * seg),
        gulikaStart: new Date(sr.getTime() + gulikaSeg * seg), gulikaEnd: new Date(sr.getTime() + (gulikaSeg + 1) * seg)
      };
    }

    function getKaranaKey(diff) {
      const k = Math.floor(diff / 6);
      if (k === 0) return "Kimstughna"; if (k === 57) return "Shakuni"; if (k === 58) return "Chatushpada"; if (k === 59) return "Naga";
      return KARANAS_MOV[(k - 1) % 7];
    }

    // --- Memoized Purnimanta Mithila Panchang ---
    function getPanchang(date, includeExtras = false) {
      const y = date.getFullYear(), m = date.getMonth(), day = date.getDate();
      const now = new Date();
      const isToday = y === now.getFullYear() && m === now.getMonth() && day === now.getDate();
      const key = `${y}-${m}-${day}-${includeExtras?1:0}-${cityKey}`;
      if (!isToday && panchangCache.has(key)) return panchangCache.get(key);

      const dAM = cityTimeDate(y, m, day, 6, 0);
      const dPM = cityTimeDate(y, m, day, 18, 0);
      const d = isToday ? now : dAM;

      const ayan = getAyanamsa(d);
      const sun = getSunLon(d), moon = getMoonLon(d);
      const sunSid = norm(sun - ayan), moonSid = norm(moon - ayan), diff = norm(moon - sun);

      const tithiIdx = Math.floor(diff / 12);
      const pakshaKey = tithiIdx < 15 ? "shukla" : "krishna";
      const nakIdx = Math.floor(moonSid / (360 / 27));
      const yogaIdx = Math.floor(norm(sunSid + moonSid) / (360 / 27));
      const sunRashiIdx = Math.floor(sunSid / 30), moonRashiIdx = Math.floor(moonSid / 30);

      // Adhika Masa & Purnimanta Masa
      const nmPrev = new Date(d.getTime() - (diff / 12.19075) * 86400000);
      const nmNext = new Date(nmPrev.getTime() + 29.53059 * 86400000);
      const sunPrevR = Math.floor(norm(getSunLon(nmPrev) - getAyanamsa(nmPrev)) / 30);
      const sunNextR = Math.floor(norm(getSunLon(nmNext) - getAyanamsa(nmNext)) / 30);
      const isAdhika = (sunPrevR === sunNextR);
      const amantaIdx = (sunPrevR + 1) % 12;
      const masaIdx = (tithiIdx < 15 || isAdhika) ? amantaIdx : (amantaIdx + 1) % 12;

      // Exact Vikram Samvat (flips on Chaitra Shukla Pratipada, not Chaitra Krishna)
      const isBeforeNewYear = (m < 4) && (masaIdx >= 9 || (masaIdx === 0 && tithiIdx >= 15));
      const vikramSamvat = isBeforeNewYear ? y + 56 : y + 57;
      const shakaSamvat = vikramSamvat - 135;

      // De-duplicated Festival Detection (Udaya Tithi + Kshaya Tithi check)
      const tithiAM = Math.floor(norm(getMoonLon(dAM) - getSunLon(dAM)) / 12);
      const tithiPM = Math.floor(norm(getMoonLon(dPM) - getSunLon(dPM)) / 12);
      const dYestAM = new Date(dAM.getTime() - 86400000);
      const dTomAM  = new Date(dAM.getTime() + 86400000);
      const tithiYestAM = Math.floor(norm(getMoonLon(dYestAM) - getSunLon(dYestAM)) / 12);
      const tithiTomAM  = Math.floor(norm(getMoonLon(dTomAM) - getSunLon(dTomAM)) / 12);
      const nakPM = Math.floor(norm(getMoonLon(dPM) - ayan) / (360 / 27));
      const hasDualTithi = tithiAM !== tithiPM;

      let festKey = null;
      if (!isAdhika) {
        if (FESTIVALS[`${masaIdx}-${tithiAM}`] && tithiYestAM !== tithiAM) festKey = `${masaIdx}-${tithiAM}`;
        else if (hasDualTithi && tithiTomAM !== tithiPM && FESTIVALS[`${masaIdx}-${tithiPM}`]) festKey = `${masaIdx}-${tithiPM}`;
      }
      const sunAM = norm(getSunLon(dAM) - getAyanamsa(dAM));
      const sunTomAM = norm(getSunLon(dTomAM) - getAyanamsa(dTomAM));
      if (sunAM < 270 && sunTomAM >= 270) festKey = "makar";

      const illum = Math.round(((1 - Math.cos(diff * Math.PI / 180)) / 2) * 100);
      const res = {
        date: d, dow: date.getDay(), tithiIdx, tithiAM, tithiPM, hasDualTithi, pakshaKey,
        nakIdx, nakPM, yogaIdx, karanaKey: getKaranaKey(diff),
        masaIdx, masaNum: masaIdx + 1, isAdhika, sunRashiIdx, moonRashiIdx,
        rituIdx: Math.floor(masaIdx / 2), ayanaIdx: (sunSid >= 270 || sunSid < 90) ? 0 : 1,
        vikramSamvat, shakaSamvat, illum, festKey
      };
      if (includeExtras) {
        res.tithiStart = findPhaseTime(d, tithiIdx * 12);
        res.tithiEnd = findPhaseTime(d, ((tithiIdx + 1) * 12) % 360);
        if (hasDualTithi) {
          res.tithiAMStart = findPhaseTime(dAM, tithiAM * 12);
          res.tithiAMEnd = findPhaseTime(dAM, ((tithiAM + 1) * 12) % 360);
          res.tithiPMStart = findPhaseTime(dPM, tithiPM * 12);
          res.tithiPMEnd = findPhaseTime(dPM, ((tithiPM + 1) * 12) % 360);
        }
        res.sunTimes = getRiseSet(y, m, day, date.getDay());
      }
      if (!isToday) panchangCache.set(key, res);
      return res;
    }

    function getHinduDaysLeft() {
      const todayKey = localISO(new Date());
      if (cachedDaysLeft !== null && cachedDaysLeftDate === todayKey) return cachedDaysLeft;
      const base = new Date(); base.setHours(0,0,0,0);
      for (let i = 1; i <= 390; i++) {
        const p = getPanchang(new Date(base.getTime() + i * 86400000), false);
        if (p.masaIdx === 0 && !p.isAdhika && p.tithiAM === 0) { cachedDaysLeft = i; cachedDaysLeftDate = todayKey; return i; }
      }
      return 0;
    }

    // --- Formatting & Native Share ---
    function fmtTime(dt) {
      if (!dt) return "—";
      try { return new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true }).format(dt); }
      catch { let h = dt.getHours(), m = String(dt.getMinutes()).padStart(2, "0"); return `${h % 12 || 12}:${m} ${h >= 12 ? "PM" : "AM"}`; }
    }
    function fmtShortDate(dt) { const L = I18N[lang]; return `${L.gDaysShort[dt.getDay()]}, ${dt.getDate()} ${L.gMonthsShort[dt.getMonth()]} ${dt.getFullYear()}`; }
    function fmtFullDate(dt) { const L = I18N[lang]; return `${L.gDays[dt.getDay()]}, ${dt.getDate()} ${L.gMonths[dt.getMonth()]} ${dt.getFullYear()}`; }
    function fmtDT(dt) { return dt ? `${dt.getDate()} ${I18N[lang].gMonthsShort[dt.getMonth()]}, ${fmtTime(dt)}` : "—"; }
    function fmtDays(n) { const L = I18N[lang]; return n === 0 ? L.today : (n === 1 ? `1 ${L.day}` : `${n} ${L.days}`); }
    function localISO(dt) { return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; }

    function shareText(title, text) {
      if (navigator.share) { navigator.share({ title, text }).catch(() => {}); }
      else if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => alert(I18N[lang].copied)); }
    }

    // --- Location ---
    function renderCityDropdown() {
      const sel = document.getElementById("citySelect");
      let html = Object.keys(CITIES).map(k => `<option value="${k}">${CITIES[k][lang]}</option>`).join("");
      if (cityKey === "gps") html += `<option value="gps">📍 GPS (${LAT.toFixed(2)}, ${LON.toFixed(2)})</option>`;
      sel.innerHTML = html;
      sel.value = cityKey;
    }

    function selectCity(val) {
      if (val === "gps") return;
      cityKey = val; LAT = CITIES[val].lat; LON = CITIES[val].lon; TZ = CITIES[val].tz; OFFSET = CITIES[val].offset;
      sSet("mc_city", val); sSet("mc_lat", LAT); sSet("mc_lon", LON); sSet("mc_tz", TZ); sSet("mc_offset", OFFSET);
      panchangCache.clear(); renderedTabs.clear(); renderActiveView();
    }

    function requestGPS() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        cityKey = "gps"; LAT = pos.coords.latitude; LON = pos.coords.longitude;
        TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Kolkata";
        OFFSET = -new Date().getTimezoneOffset();

    // --- Muhurat ---
    const MUHURAT_RULES = {
      vivah:    { naks:[3,4,9,11,12,14,16,18,20,25,26], badDow:[2,6], strict:true },
      griha:    { naks:[3,4,11,13,16,20,22,25,26],     badDow:[0,2], strict:true },
      vehicle:  { naks:[0,6,7,12,13,14,21,22,23,26],   badDow:[2,6], strict:false },
      namkaran: { naks:[0,3,4,6,7,11,12,13,14,16,21,22,23,25,26], badDow:[2,6], strict:false },
      business: { naks:[0,3,4,6,7,11,12,13,14,16,20,21,22,26],    badDow:[2],   strict:false }
    };

    function getDoshas(p) {
      const list = [];
      if ([22,23,24,25,26].includes(p.nakIdx)) list.push(lang === "hi" ? "पंचक" : "Panchak");
      if ([0,8,9,17,18,26].includes(p.nakIdx)) list.push(lang === "hi" ? "गंडमूल" : "Gandmool");
      if (p.karanaKey === "Vishti") list.push(lang === "hi" ? "भद्रा" : "Bhadra");
      if (p.yogaIdx === 16) list.push(lang === "hi" ? "व्यतीपात" : "Vyatipata");
      if (p.yogaIdx === 26) list.push(lang === "hi" ? "वैधृति" : "Vaidhriti");
      return list;
    }

    function renderMuhurat(type = currentMuhurat) {
      currentMuhurat = type;
      const L = I18N[lang], rule = MUHURAT_RULES[type];
      document.getElementById("muhuratChips").innerHTML = Object.keys(L.muhuratCats).map(k =>
        `<div class="chip ${k===type?'active':''}" role="button" onclick="renderMuhurat('${k}')">${L.muhuratCats[k]}</div>`
      ).join("");

      const base = new Date(); base.setHours(0,0,0,0);
      const results = [];
      for (let i = 0; i <= 90 && results.length < 10; i++) {
        const dt = new Date(base.getTime() + i * 86400000), p = getPanchang(dt, false);
        const t15 = p.tithiAM % 15;
        if ([3, 8, 13].includes(t15) || p.tithiAM === 29 || rule.badDow.includes(p.dow)) continue;
        if (!rule.naks.includes(p.nakIdx) && !rule.naks.includes(p.nakPM)) continue;
        if (p.karanaKey === "Vishti") continue;
        if (p.masaIdx === 6 && p.pakshaKey === "krishna") continue;
        if (rule.strict) {
          if ([22,23,24,25,26].includes(p.nakIdx) || [0,8,9,17,18,26].includes(p.nakIdx)) continue;
          if (p.sunRashiIdx === 8 || p.sunRashiIdx === 11 || p.isAdhika) continue;
          const isChat = (p.masaIdx === 3 && p.tithiAM >= 10) || p.masaIdx === 4 || p.masaIdx === 5 || p.masaIdx === 6 || (p.masaIdx === 7 && p.tithiAM < 10);
          if (isChat) continue;
          const sun = getSunLon(dt), ven = getPlanetLon("Venus", dt), jup = getPlanetLon("Jupiter", dt);
          if (Math.min(norm(ven - sun), norm(sun - ven)) < 9 || Math.min(norm(jup - sun), norm(sun - jup)) < 11) continue;
        }
        results.push({ dt, days: i, p, st: getRiseSet(dt.getFullYear(), dt.getMonth(), dt.getDate(), dt.getDay()) });
      }

      document.getElementById("muhuratList").innerHTML = results.length ? results.map((r, idx) => {
        const shareMsg = `${L.muhuratCats[type]} Muhurat: ${fmtShortDate(r.dt)} (${MASAS[lang][r.p.masaIdx]} ${L[r.p.pakshaKey]} ${TITHIS[lang][r.p.tithiAM]}, ${NAKSHATRAS[lang][r.p.nakIdx]}). ${L.abhijit}: ${fmtTime(r.st.abhijitStart)}–${fmtTime(r.st.abhijitEnd)}`;
        return `<div class="exp-wrap" id="m-exp-${idx}">
          <div class="exp-head" role="button" onclick="document.getElementById('m-exp-${idx}').classList.toggle('open')">
            <div>
              <div class="li-name">${fmtShortDate(r.dt)}</div>
              <div class="li-sub">${MASAS[lang][r.p.masaIdx]} ${L[r.p.pakshaKey]} ${TITHIS[lang][r.p.tithiAM]} • ${NAKSHATRAS[lang][r.p.nakIdx]}</div>
            </div>
            <div class="li-badge">${fmtDays(r.days)} ▾</div>
          </div>
          <div class="exp-body">
            <b>${L.abhijit}:</b> ${fmtTime(r.st.abhijitStart)} – ${fmtTime(r.st.abhijitEnd)}<br>
            <b>${L.nakshatra}:</b> ${NAKSHATRAS[lang][r.p.nakIdx]} • <b>${L.dosha}:</b> ${L.noDosha}
            <div class="action-row">
              <span class="mini-link" role="button" onclick="jumpToDate(${r.dt.getFullYear()},${r.dt.getMonth()},${r.dt.getDate()})">${L.viewInCal} →</span>
              <span class="mini-link" role="button" onclick="shareText('Muhurat', \`${shareMsg}\`)">📤 ${L.share}</span>
            </div>
          </div>
        </div>`;
      }).join("") : `<div class="note" style="color:var(--warn);">${L.noMuhurat}</div>`;
    }

    // --- Astro & Computed Eclipses (Localized) ---
    function resetAstroDate() { document.getElementById("astroDate").value = localISO(new Date()); renderPlanets(); }

    function renderPlanets() {
      const val = document.getElementById("astroDate").value;
      const dt = val ? new Date(val + "T12:00:00") : new Date();
      const p = getPanchang(dt, false), L = I18N[lang], ayan = getAyanamsa(dt);
      const doshas = getDoshas(p), westIdx = Math.floor(getSunLon(dt) / 30);

      document.getElementById("astroSummary").innerHTML = `
        <div class="mini-card" style="background:var(--bg);"><div class="mini-lbl">${L.sunSign}</div><div class="mini-val mint">${RASHIS[lang][p.sunRashiIdx]} • ${WESTERN[lang][westIdx]}</div></div>
        <div class="mini-card" style="background:var(--bg);"><div class="mini-lbl">${L.moonSign}</div><div class="mini-val mint">${RASHIS[lang][p.moonRashiIdx]}</div></div>
        <div class="mini-card" style="background:var(--bg);"><div class="mini-lbl">${L.nakshatra}</div><div class="mini-val">${NAKSHATRAS[lang][p.nakIdx]}</div></div>
        <div class="mini-card" style="background:var(--bg);"><div class="mini-lbl">${L.dosha}</div><div class="mini-val ${doshas.length?'warn':'mint'}">${doshas.length ? doshas.join(", ") : L.noDosha}</div></div>`;

      const names = ["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn","Rahu","Ketu"];
      document.getElementById("planetList").innerHTML = names.map(name => {
        const lon = getPlanetLon(name, dt), lonNext = getPlanetLon(name, new Date(dt.getTime() + 86400000));
        let delta = lonNext - lon; if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
        const sid = norm(lon - ayan), rIdx = Math.floor(sid / 30);
        const retro = (name !== "Sun" && name !== "Moon" && delta < 0);
        return `<div class="row">
          <span class="lbl" style="color:var(--text);font-weight:600;">${lang==="hi"?PLANET_HI[name]:name} ${retro?`<span class="warn-tag">${L.vakri}</span>`:""}</span>
          <span class="val mint">${RASHIS[lang][rIdx]} ${(sid % 30).toFixed(1)}°</span>
        </div>`;
      }).join("");
    }

    function renderTransitsAndEclipses() {
      const L = I18N[lang], base = new Date(); base.setHours(12,0,0,0);
      const tracked = ["Sun","Mars","Mercury","Venus","Jupiter","Saturn"], startMap = {}, found = [];
      tracked.forEach(n => startMap[n] = Math.floor(norm(getPlanetLon(n, base) - getAyanamsa(base)) / 30));
      for (let i = 1; i <= 120 && found.length < 6; i++) {
        const dt = new Date(base.getTime() + i * 86400000), ayan = getAyanamsa(dt);
        for (const n of tracked) {
          const r = Math.floor(norm(getPlanetLon(n, dt) - ayan) / 30);
          if (r !== startMap[n]) { found.push({ n, r, dt, days: i }); startMap[n] = r; }
        }
      }
      document.getElementById("transitList").innerHTML = found.map(t => `
        <div class="list-item">
          <div><div class="li-name">${lang==="hi"?PLANET_HI[t.n]:t.n} ${L.enters} ${RASHIS[lang][t.r]}</div><div class="li-sub">${fmtShortDate(t.dt)}</div></div>
          <div class="li-badge">${fmtDays(t.days)}</div>
        </div>`).join("");

      const ecl = [];
      if (HAS_ASTRO) {
        let sE = Astronomy.SearchGlobalSolarEclipse(base), lE = Astronomy.SearchLunarEclipse(base);
        for (let k = 0; k < 3; k++) {
          if (sE) { ecl.push({ dt: sE.peak.date, title: `${L.eclKinds[sE.kind]||sE.kind} ${L.eclSolar}`, sutak: L.sutakSolar }); sE = Astronomy.NextGlobalSolarEclipse(sE.peak); }
          if (lE) { ecl.push({ dt: lE.peak.date, title: `${L.eclKinds[lE.kind]||lE.kind} ${L.eclLunar}`, sutak: lE.kind === "penumbral" ? L.sutakPen : L.sutakLunar }); lE = Astronomy.NextLunarEclipse(lE.peak); }
        }
        ecl.sort((a, b) => a.dt - b.dt);
      }
      document.getElementById("eclipseList").innerHTML = ecl.length ? ecl.slice(0, 6).map(e => `
        <div class="list-item">
          <div><div class="li-name">${e.title}</div><div class="li-sub">${fmtShortDate(e.dt)} • ${fmtTime(e.dt)}<br><b>${L.sutak}:</b> ${e.sutak}</div></div>
        </div>`).join("") : `<div class="note">Connect once to load astronomy-engine.</div>`;
    }

    // --- Events & Puja ---
    const QUICK_PRESETS = [["Any",10],["shukla",14],["krishna",14],["krishna",3],["Any",12]];
    function renderCountdowns() {
      const L = I18N[lang];
      document.getElementById("quickChips").innerHTML = L.quickChips.map((lbl, idx) =>
        `<div class="chip ${idx===activeQuickIdx?'active':''}" role="button" onclick="quickTithi(${idx})">${lbl}</div>`
      ).join("");
      document.getElementById("selPaksha").innerHTML = `
        <option value="Any" ${finderPaksha==="Any"?"selected":""}>${L.anyPaksha}</option>
        <option value="shukla" ${finderPaksha==="shukla"?"selected":""}>${L.shuklaFull}</option>
        <option value="krishna" ${finderPaksha==="krishna"?"selected":""}>${L.krishnaFull}</option>`;
      document.getElementById("selTithi").innerHTML = TITHI_15[lang].map((t, i) => `<option value="${i}" ${i===finderTithi?'selected':''}>${t}</option>`).join("");
      updateTithiFinder();
      document.getElementById("festList").innerHTML = getUpcomingFestivals(18).map(f => `
        <div class="list-item" role="button" style="cursor:pointer;" onclick="jumpToDate(${f.date.getFullYear()},${f.date.getMonth()},${f.date.getDate()})">
          <div><div class="li-name">${FESTIVALS[f.festKey][lang]}</div><div class="li-sub">${fmtShortDate(f.date)} • ${MASAS[lang][f.p.masaIdx]}</div></div>
          <div class="li-badge">${fmtDays(f.days)}</div>
        </div>`).join("");
    }
    function quickTithi(idx) { activeQuickIdx = idx; finderPaksha = QUICK_PRESETS[idx][0]; finderTithi = QUICK_PRESETS[idx][1]; renderCountdowns(); }
    function updateTithiFinder() {
      finderPaksha = document.getElementById("selPaksha").value;
      finderTithi = parseInt(document.getElementById("selTithi").value, 10);
      const base = new Date(); base.setHours(0,0,0,0);
      let res = null;
      for (let i = 0; i <= 60; i++) {
        const dt = new Date(base.getTime() + i * 86400000), p = getPanchang(dt, false);
        if ((p.tithiAM % 15) === finderTithi && (finderPaksha === "Any" || p.pakshaKey === finderPaksha)) { res = { dt, days: i, p: getPanchang(dt, true) }; break; }
      }
      if (!res) return;
      const L = I18N[lang];
      document.getElementById("finderResult").innerHTML = `
        <div>
          <div class="fest-name" style="font-size:15px;">${L[res.p.pakshaKey]} ${TITHIS[lang][res.p.tithiAM]}</div>
          <div class="fest-date">${fmtShortDate(res.dt)} • ${MASAS[lang][res.p.masaIdx]}</div>
          <div class="fest-date" style="color:var(--mint);margin-top:3px;">${fmtDT(res.p.tithiStart)} → ${fmtDT(res.p.tithiEnd)}</div>
        </div>
        <div class="days-badge"><div class="num">${res.days === 0 ? "★" : res.days}</div><div class="lbl">${res.days === 0 ? L.today : (res.days === 1 ? L.day : L.days)}</div></div>`;
    }

    function switchPujaMode(mode) {
      pujaMode = mode;
      document.getElementById("seg-mantra").classList.toggle("active", mode === "mantra");
      document.getElementById("seg-vidhi").classList.toggle("active", mode === "vidhi");
      renderPujaTab();
    }
    function renderPujaTab() {
      const box = document.getElementById("pujaContent"), q = (document.getElementById("pujaSearch").value || "").toLowerCase();
      const L = I18N[lang];
      if (pujaMode === "mantra") {
        const list = SANSKRIT_MANTRAS.filter(m => !q || m.title.toLowerCase().includes(q) || m.text.toLowerCase().includes(q));
        box.innerHTML = list.map(m => `<div class="mantra-card" lang="sa"><div class="mantra-title">${m.title}</div><div class="mantra-text">${m.text}</div></div>`).join("");
      } else {
        const list = MAITHIL_VIDHIS.filter(v => !q || v.enTitle.toLowerCase().includes(q) || v.hiTitle.toLowerCase().includes(q));
        box.innerHTML = `<div class="card">` + list.map((v, idx) => {
          const title = lang === "hi" ? v.hiTitle : v.enTitle;
          const steps = lang === "hi" ? v.hiSteps : v.enSteps;
          const shareStr = `${title}\n` + steps.map((s, i) => `${i+1}. ${s}`).join("\n");
          return `<div class="exp-wrap ${idx===0&&!q?'open':''}" id="v-exp-${idx}" lang="${lang}">
            <div class="exp-head" role="button" onclick="document.getElementById('v-exp-${idx}').classList.toggle('open')">
              <div><div class="li-name">${title}</div><div class="li-sub">${lang==="hi"?v.hiSub:v.enSub}</div></div>
              <div class="li-badge">▾</div>
            </div>
            <div class="exp-body">
              <ol class="vidhi-steps">${steps.map(s => `<li>${s}</li>`).join("")}</ol>
              <div class="action-row"><span class="mini-link" role="button" onclick="shareText('${title.replace(/'/g,"")}', \`${shareStr.replace(/`/g,"")}\`)">📤 ${L.share}</span></div>
            </div>
          </div>`;
        }).join("") + `</div>`;
      }
    }

    // --- Navigation & Controls ---
    function switchCalMode(mode) {
      calMode = mode;
      document.getElementById("seg-cal").classList.toggle("active", mode === "cal");
      document.getElementById("seg-events").classList.toggle("active", mode === "events");
      document.getElementById("cal-panel").style.display = mode === "cal" ? "block" : "none";
      document.getElementById("events-panel").style.display = mode === "events" ? "block" : "none";
      if (mode === "events") renderCountdowns();
    }

    function switchTab(name) {
      currentTab = name;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById(`view-${name}`).classList.add("active");
      document.getElementById(`tab-${name}`).classList.add("active");
      document.getElementById("topTitle").innerText = I18N[lang].titles[name];
      renderActiveView();
      window.scrollTo(0, 0);
    }

    function renderActiveView() {
      applyStaticLabels();
      renderHeader();
      if (currentTab === "calendar") { renderBanner(); renderCalendar(); if (calMode === "events") renderCountdowns(); }
      else if (currentTab === "panchang" && !renderedTabs.has("panchang")) { renderPanchangTab(); renderedTabs.add("panchang"); }
      else if (currentTab === "muhurat" && !renderedTabs.has("muhurat")) { renderMuhurat(currentMuhurat); renderedTabs.add("muhurat"); }
      else if (currentTab === "astro" && !renderedTabs.has("astro")) { renderPlanets(); renderTransitsAndEclipses(); renderedTabs.add("astro"); }
      else if (currentTab === "puja" && !renderedTabs.has("puja")) { renderPujaTab(); renderedTabs.add("puja"); }
    }

    function toggleLang() { lang = lang === "en" ? "hi" : "en"; sSet("mc_lang", lang); renderedTabs.clear(); renderActiveView(); }
    function toggleTextSize() {
      largeText = !largeText; sSet("mc_large", largeText ? "1" : "0");
      document.body.classList.toggle("large-text", largeText);
      document.getElementById("textBtn").classList.toggle("active", largeText);
    }
    function toggleTheme() {
      theme = theme === "dark" ? "light" : "dark"; sSet("mc_theme", theme);
      document.body.classList.toggle("light", theme === "light");
      document.getElementById("themeBtn").innerText = theme === "light" ? "🌙" : "☀️";
      document.getElementById("metaTheme").content = theme === "light" ? "#F4F5F7" : "#121214";
    }
    function toggleCompact() { compact = !compact; sSet("mc_compact", compact ? "1" : "0"); applyStaticLabels(); renderCalendar(); }
    function selectDay(y, m, d) { selectedDate = new Date(y, m, d); renderCalendar(); }
    function changeMonth(delta) { viewDate.setMonth(viewDate.getMonth() + delta); renderCalendar(); }
    function goToday() { viewDate = new Date(); selectedDate = new Date(); switchCalMode("cal"); switchTab("calendar"); }
    function jumpToDate(y, m, d) { viewDate = new Date(y, m, 1); selectedDate = new Date(y, m, d); switchCalMode("cal"); switchTab("calendar"); }

    function toggleJumpBar() {
      const bar = document.getElementById("jumpBar");
      bar.classList.toggle("open");
      if (bar.classList.contains("open")) {
        document.getElementById("jumpMonth").innerHTML = I18N[lang].gMonths.map((m, i) => `<option value="${i}" ${i===viewDate.getMonth()?'selected':''}>${m}</option>`).join("");
        let yrs = ""; for (let y = 2020; y <= 2035; y++) yrs += `<option value="${y}" ${y===viewDate.getFullYear()?'selected':''}>${y}</option>`;
        document.getElementById("jumpYear").innerHTML = yrs;
      }
    }
    function applyJump() {
      viewDate = new Date(parseInt(document.getElementById("jumpYear").value, 10), parseInt(document.getElementById("jumpMonth").value, 10), 1);
      renderCalendar();
    }

    // Swipe Left/Right
    let touchX = 0;
    const calArea = document.getElementById("calSwipeArea");
    calArea.addEventListener("touchstart", e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
    calArea.addEventListener("touchend", e => { const dx = e.changedTouches[0].screenX - touchX; if (Math.abs(dx) > 55) changeMonth(dx < 0 ? 1 : -1); }, { passive: true });

    document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderedTabs.clear(); renderActiveView(); } });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    // Boot
    if (theme === "light") { document.body.classList.add("light"); document.getElementById("themeBtn").innerText = "🌙"; }
    if (largeText) { document.body.classList.add("large-text"); document.getElementById("textBtn").classList.add("active"); }
    document.getElementById("astroDate").value = localISO(new Date());
    renderActiveView();
  </script>
</body>
</html>
